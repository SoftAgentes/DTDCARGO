<!doctype html>
<html lang="es" data-project-slug="{{PROJECT_SLUG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="forge-project-slug" content="{{PROJECT_SLUG}}">
  <title>Bitácora {{PROJECT_NAME}}</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #101010; color: #f5f5f2; }
    main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    .eyebrow { color: #9b9b94; text-transform: uppercase; letter-spacing: .14em; }
    h1 { margin: 8px 0 16px; font-size: clamp(2.4rem, 7vw, 5.5rem); line-height: .95; }
    .card { margin-top: 32px; padding: 24px; border: 1px solid #343430; border-radius: 18px; background: #181817; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    dt, dd { padding-bottom: 12px; border-bottom: 1px solid #30302d; }
    dd { margin: 0; font-weight: 700; }
    code { color: #9dd7ff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Registro de trabajo</p>
    <h1>Bitácora {{PROJECT_NAME}}</h1>
    <p>Decisiones, tareas, evidencia y consumo medido del proyecto.</p>
    <section class="card">
      <h2>Inversión medida</h2>
      <dl>
        <dt>Horas activas</dt><dd id="hours">0 h</dd>
        <dt>Tokens generados</dt><dd id="generated">0 M</dd>
        <dt>Tokens procesados</dt><dd id="processed">0 M</dd>
      </dl>
    </section>
    <section class="card">
      <h2>Cómo actualizar</h2>
      <p>El integrador ejecuta <code>npm run bitacora:metrics:write</code> después de agregar los handoffs.</p>
    </section>
  </main>
  <script id="bitacora-metrics" type="application/json">{"sources":{},"dates":{},"totals":{"hours":0,"genM":0,"procM":0}}</script>
  <script>
    const metrics = JSON.parse(document.getElementById('bitacora-metrics').textContent);
    document.getElementById('hours').textContent = `${metrics.totals?.hours || 0} h`;
    document.getElementById('generated').textContent = `${metrics.totals?.genM || 0} M`;
    document.getElementById('processed').textContent = `${metrics.totals?.procM || 0} M`;
    localStorage.setItem('{{PROJECT_SLUG}}-bitacora-last-open-v1', new Date().toISOString());
  </script>
</body>
</html>
