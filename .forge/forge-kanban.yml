version: 2
mode: auto
ticket_dir: .forge/backlog/tickets
kanban_view: KANBAN.md
max_forja_agents: 3
models:
  sol:
    provider: anthropic
    model: claude-opus-4-8
    reasoning_effort: max
  terra:
    provider: anthropic
    model: claude-opus-4-8
    reasoning_effort: high
  luna:
    provider: anthropic
    model: claude-haiku-4-5
    reasoning_effort: null
dashboard:
  strategy: detect_and_reuse
  create_if_missing: false
  fail_on_multiple_candidates: true
reconcile:
  roots: [docs/specs]
  file_names: [spec.md]
  report_dir: .forge/reports
