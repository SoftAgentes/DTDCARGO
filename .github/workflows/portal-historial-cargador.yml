name: Cargador del chat del portal

# SDD-0586 §10.5.10, paso 3: prueba del cargador del chat del portal a Chatwoot con datos INVENTADOS, sobre la
# imagen real de Chatwoot (fijada por digest en infra/chatwoot/compose.yml) con su Postgres y su Redis. Mide C-2 a
# C-5 y C-9 a C-14, los vínculos, y corre el control M0 y los mutantes (prueba-cargador.sh).
#
# Sin secretos ni variables del repositorio, y sin pedirle nada a internet desde Rails: el servicio `prepare` vive
# en la red `interna` (internal: true) del compose. No toca Studio ni producción.
# No reemplaza a «Calidad continua» (quality.yml).

on:
  pull_request:
    paths:
      - "infra/ops/portal-historial/**"
      - "infra/chatwoot/compose.yml"
      - "infra/chatwoot/pruebas/compose.local.yml"
      - "infra/chatwoot/rails/**"
      - ".github/workflows/portal-historial-cargador.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-cargador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargador:
    name: Cargador del chat del portal (datos inventados)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cargador en Chatwoot con Postgres y Redis, control y mutantes
        run: bash infra/ops/portal-historial/pruebas/prueba-cargador.sh
