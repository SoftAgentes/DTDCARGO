name: Imagen Docker de prueba

# SDD-0540 §2.5 · construye la imagen del ENTORNO DE PRUEBA de un SHA y la publica
# en GHCR como `ghcr.io/softagentes/dtdcargo:prueba-sha-<sha completo>`.
#
# Solo a mano (`workflow_dispatch`), nunca en push ni en pull_request: una PR no
# publica nada sola. Lo dispara el Director (o el Worker con permiso de publicar):
#   gh workflow run build-image-prueba.yml --ref <rama> -f sha=<sha del head>
#   gh run watch <id> --exit-status
#
# NO DESPLIEGA: lo hace la sesión de Contabo con infra/ops/staging/desplegar-prueba.sh.
#
# Las `NEXT_PUBLIC_*` se inlinean en el bundle en `next build`, así que la imagen de
# prueba se construye con valores de prueba. Salen del entorno `prueba` de GitHub,
# con NOMBRES DISTINTOS a los de producción (`PRUEBA_*`): si faltara una, no se
# hereda en silencio la del repositorio (que es la de producción). Son variables,
# nunca secrets: todo lo que entra por build arg queda legible en la imagen.
#
# Etiqueta única `prueba-sha-<sha>`: nunca `sha-*` ni `:main`, para que ninguna
# imagen de prueba se confunda con una de producción.
#
# Dos valores fijos que no salen de variables (SDD-0544, Fase 2 de la SDD-0540):
#   - NEXT_PUBLIC_GA_ID=off apaga Google Analytics y la etiqueta de Ads en el build
#     (components/Analytics.tsx). La comprobación del bundle exige 0 archivos de
#     .next/static con G-25CD7BZH98 o AW-561290482.
#   - APP_ENV=staging llega al `next build` (ARG del Dockerfile) para que las páginas
#     prerenderizadas también lleven el aviso «Entorno de prueba».
#
# scripts/__tests__/build-image-prueba-workflow.test.mjs vigila este contrato.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA completo (40 hex) del commit a construir"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Una sola ranura de prueba: un build a la vez, sin cancelar el que corre.
concurrency:
  group: build-image-prueba
  cancel-in-progress: false

jobs:
  build-image-prueba:
    name: Construir y publicar la imagen de prueba
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prueba
    env:
      IMAGE: ghcr.io/softagentes/dtdcargo
      SHA: ${{ inputs.sha }}
      PRUEBA_HOST: supabase-prueba.dtdcargo.com
      PROD_HOST: supabase.dtdcargo.com
      CLOUD_REF: xpfuzqombmjmxvprjgmi
    steps:
      - name: Guard de las variables de prueba
        env:
          PRUEBA_SITE_URL: ${{ vars.PRUEBA_SITE_URL }}
          PRUEBA_SUPABASE_URL: ${{ vars.PRUEBA_SUPABASE_URL }}
          PRUEBA_SUPABASE_ANON_KEY: ${{ vars.PRUEBA_SUPABASE_ANON_KEY }}
          PRUEBA_AUTH_COOKIE: ${{ vars.PRUEBA_AUTH_COOKIE }}
          PRUEBA_VAPID_PUBLIC_KEY: ${{ vars.PRUEBA_VAPID_PUBLIC_KEY }}
          PROD_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_AUTH_COOKIE: ${{ vars.NEXT_PUBLIC_SUPABASE_AUTH_COOKIE }}
          PROD_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          set -u
          mal=0
          falla() { echo "::error::$1"; mal=1; }
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || falla "sha tiene que ser el SHA completo (40 hex)"
          for v in PRUEBA_SITE_URL PRUEBA_SUPABASE_URL PRUEBA_SUPABASE_ANON_KEY PRUEBA_AUTH_COOKIE; do
            [[ -n "${!v}" ]] || falla "${v} está vacía en el entorno prueba"
          done
          [[ "${PRUEBA_SUPABASE_URL}" == "https://${PRUEBA_HOST}" ]] || falla "PRUEBA_SUPABASE_URL no es https://${PRUEBA_HOST}"
          [[ "${PRUEBA_SITE_URL}" == "https://prueba.dtdcargo.com" ]] || falla "PRUEBA_SITE_URL no es https://prueba.dtdcargo.com"
          # VAPID puede ir vacía (push apagado en prueba, §2.7); nunca la de producción.
          for v in PRUEBA_SITE_URL PRUEBA_SUPABASE_URL PRUEBA_SUPABASE_ANON_KEY PRUEBA_AUTH_COOKIE PRUEBA_VAPID_PUBLIC_KEY; do
            case "${!v}" in
              *"${PROD_HOST}"*|*"${CLOUD_REF}"*) falla "${v} apunta a producción o a Supabase Cloud" ;;
            esac
          done
          [[ "${PRUEBA_SUPABASE_ANON_KEY}" != "${PROD_SUPABASE_ANON_KEY}" ]] || falla "PRUEBA_SUPABASE_ANON_KEY es la de producción"
          [[ "${PRUEBA_AUTH_COOKIE}" != "${PROD_AUTH_COOKIE}" ]] || falla "PRUEBA_AUTH_COOKIE es la de producción"
          [[ "${PRUEBA_SITE_URL}" != "${PROD_SITE_URL}" ]] || falla "PRUEBA_SITE_URL es la de producción"
          if [[ -n "${PRUEBA_VAPID_PUBLIC_KEY}" && "${PRUEBA_VAPID_PUBLIC_KEY}" == "${PROD_VAPID_PUBLIC_KEY}" ]]; then
            falla "PRUEBA_VAPID_PUBLIC_KEY es la de producción"
          fi
          exit "${mal}"

      - name: Descargar el repositorio en el SHA pedido
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Confirmar el SHA
        run: |
          [[ "$(git rev-parse HEAD)" == "${SHA}" ]] || { echo "::error::el checkout no quedó en ${SHA}"; exit 1; }

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir sin publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:prueba-sha-${{ inputs.sha }}
          cache-from: type=gha,scope=prueba
          cache-to: type=gha,mode=max,scope=prueba
          provenance: false
          # Solo variables del entorno `prueba`, el SHA y los dos valores fijos de la
          # SDD-0544 (GA y Ads apagados, entorno staging). Sin secrets.
          build-args: |
            APP_ENV=staging
            NEXT_PUBLIC_GA_ID=off
            NEXT_PUBLIC_BUILD_SHA=${{ inputs.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PRUEBA_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.PRUEBA_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.PRUEBA_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_AUTH_COOKIE=${{ vars.PRUEBA_AUTH_COOKIE }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.PRUEBA_VAPID_PUBLIC_KEY }}

      - name: Comprobar el bundle sin red
        id: bundle
        run: |
          set -u
          # c: archivos de todo .next · s: archivos de .next/static, lo que baja el
          # navegador · n: JS de .next/static (sin ellos un 0 no probaría nada).
          cuenta="$(docker run --rm --network none --entrypoint /bin/sh \
            -e P_PRUEBA="${PRUEBA_HOST}" -e P_PROD="${PROD_HOST}" -e P_REF="${CLOUD_REF}" \
            "${IMAGE}:prueba-sha-${SHA}" \
            -c 'c() { grep -rlF -- "$1" /app/.next 2>/dev/null | wc -l; }; s() { grep -rlF -- "$1" /app/.next/static 2>/dev/null | wc -l; }; n() { find /app/.next/static -name "*.js" 2>/dev/null | wc -l; }; echo "$(c "$P_PRUEBA") $(c "$P_PROD") $(c "$P_REF") $(n) $(s G-25CD7BZH98) $(s AW-561290482) $(c G-25CD7BZH98) $(c AW-561290482)"')"
          read -r c_prueba c_prod c_ref n_js s_ga s_ads c_ga c_ads <<< "${cuenta}"
          echo "host de prueba: ${c_prueba} · host de producción: ${c_prod} · ref de Cloud: ${c_ref}"
          echo "JS en .next/static: ${n_js} · GA ahí: ${s_ga} · Ads ahí: ${s_ads} (en todo .next: GA ${c_ga} · Ads ${c_ads})"
          [[ "${c_prueba}" -ge 1 ]] || { echo "::error::ningún archivo de .next nombra ${PRUEBA_HOST}"; exit 1; }
          [[ "${c_prod}" -eq 0 && "${c_ref}" -eq 0 ]] || { echo "::error::el bundle nombra producción o Supabase Cloud"; exit 1; }
          [[ "${n_js}" -ge 1 ]] || { echo "::error::.next/static sin JS: no se puede comprobar Google Analytics"; exit 1; }
          [[ "${s_ga}" -eq 0 && "${s_ads}" -eq 0 ]] || { echo "::error::Google Analytics o Ads en .next/static: el build no apagó NEXT_PUBLIC_GA_ID"; exit 1; }
          echo "ga=${c_ga}" >> "$GITHUB_OUTPUT"
          echo "ads=${c_ads}" >> "$GITHUB_OUTPUT"

      - name: Publicar la imagen de prueba
        run: docker push "${IMAGE}:prueba-sha-${SHA}"

      - name: Registrar lo publicado
        run: |
          {
            echo "## Imagen de prueba publicada"
            echo '```'
            echo "${IMAGE}:prueba-sha-${SHA}"
            echo '```'
            echo "Sin despliegue: la sesión de Contabo corre desplegar-prueba.sh."
            echo ""
            echo "Google Analytics y Ads: 0 archivos en .next/static (SDD-0544). En todo .next: GA ${GA} · Ads ${ADS}; fuera de static no falla; en static, verificar-aislamiento.sh falla."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GA: ${{ steps.bundle.outputs.ga }}
          ADS: ${{ steps.bundle.outputs.ads }}
