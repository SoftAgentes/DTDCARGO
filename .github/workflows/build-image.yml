name: Imagen Docker

# SDD-0505 · construye la imagen de DTD Cargo y la publica en GHCR.
#
# Publica `ghcr.io/softagentes/dtdcargo:sha-<sha completo>` en cada push a
# main (y en una corrida manual) y, solo desde main, mueve también `:main`.
# Nunca `:latest`: una etiqueta mutable sin SHA no dice qué código corre.
#
# NO DESPLIEGA. Separar "construir" de "publicar" es lo que permite construir
# sin tocar producción. Desde la SDD-0541, publicable.yml mueve `:publicable`
# cuando además el CI está en verde, y el servidor la sigue con un timer
# (infra/ops/web/publicar-web.sh). Para eso la imagen lleva dos etiquetas más:
# las migraciones del commit y las huellas de lo que vive fuera de la imagen
# (compose, cron, functions), que el servidor compara antes de publicar.
#
# Los `NEXT_PUBLIC_*` se inlinean en el bundle en `next build`, así que viajan
# como build args desde VARIABLES del repositorio (Settings → Variables), nunca
# desde secrets: todo lo que entra por build arg queda legible dentro de la
# imagen pública. Un secret ahí sería un secret publicado.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Sin `cancel-in-progress`: cada commit de main debe tener su `sha-*` publicado,
# aunque llegue otro push mientras construye. Cancelar dejaría SHAs sin imagen y
# sin posibilidad de volver a ellos con `compose pull`.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Construir y publicar en GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/softagentes/dtdcargo
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas para el servidor (SDD-0541)
        id: servidor
        # Si este paso falla, la imagen se construye igual, sin estas tres
        # etiquetas, y el servidor se niega a publicarla (falla cerrado; `volver`
        # sí puede llegar a ella si es la anterior). Se escribe primero a un
        # archivo para no dejar un bloque a medias en GITHUB_OUTPUT.
        continue-on-error: true
        run: |
          set -euo pipefail
          node infra/ops/web/publicable.mjs etiquetas > "$RUNNER_TEMP/etiquetas-0541.txt"
          huellas="$(bash infra/ops/web/huellas-fuera-de-imagen.sh repo . --etiqueta)"
          echo "org.dtdcargo.fuera-de-imagen=${huellas}" >> "$RUNNER_TEMP/etiquetas-0541.txt"
          { echo 'labels<<FIN_ETIQUETAS_0541'; cat "$RUNNER_TEMP/etiquetas-0541.txt"; echo 'FIN_ETIQUETAS_0541'; } >> "$GITHUB_OUTPUT"
          cut -c1-120 "$RUNNER_TEMP/etiquetas-0541.txt"

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest=false`: la acción lo añadiría sola en la rama por defecto.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Las de metadata-action (revision = el SHA, source = el repo) y las
          # de la SDD-0541 (vacías si su paso falló).
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.servidor.outputs.labels }}
          # Caché de capas en GitHub Actions: `pnpm install` no se repite si el
          # lockfile no cambió. `mode=max` guarda también las capas intermedias.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Una sola plataforma y sin attestation: evita el manifest `unknown/unknown`
          # que GHCR muestra junto a la imagen y que confunde al leer las etiquetas.
          provenance: false
          # Los mismos ARG que declara el Dockerfile (etapa build). Variables del
          # repo, no secrets. CONTACT_EMAIL y WHATSAPP_NUMBER hoy no los lee el
          # código, pero el Dockerfile los declara: se pasan para no desalinear.
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_HAILUWAY_API=${{ vars.NEXT_PUBLIC_HAILUWAY_API }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_AUTH_COOKIE=${{ vars.NEXT_PUBLIC_SUPABASE_AUTH_COOKIE }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_BUG_REPLAY_ENABLED=${{ vars.NEXT_PUBLIC_BUG_REPLAY_ENABLED }}
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Registrar lo publicado
        run: |
          {
            echo "## Imagen publicada"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Sin despliegue: la web la publica el servidor cuando \`:publicable\` llega a este commit (SDD-0541)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
