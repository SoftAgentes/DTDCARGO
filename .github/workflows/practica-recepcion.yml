name: Recepción China en una base efímera

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - infra/ops/tests/recepcion-preorden-efimera.sql
      - .github/workflows/practica-recepcion.yml

permissions:
  contents: read

concurrency:
  group: practica-recepcion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recepcion:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recibir carga ficticia con el esquema completo de la revisión
        env:
          PRUEBA_RECEPCION_PREORDEN: "1"
        run: bash infra/ops/tests/prueba-resetear-base-efimera.sh
