<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTD Cargo · Validación de perfil Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../tokens-social.css" />
  <style>
    :root { --navy:#0f1e3d; --wine:#7f0f1a; --line:#dbdbdb; --muted:#737373; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:#f1f1f1; color:var(--navy); font-family:"Archivo",sans-serif; }
    .phone { width:780px; margin:auto; background:#fff; border:1px solid var(--line); box-shadow:0 20px 55px rgba(15,30,61,.14); }
    header { padding:22px 28px 18px; border-bottom:1px solid var(--line); }
    .status { color:var(--wine); font:700 11px/1.2 "JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .profile { display:flex; align-items:center; gap:18px; margin-top:14px; }
    .avatar { width:60px; height:60px; display:grid; place-items:center; border-radius:50%; background:var(--navy); color:white; font-weight:900; font-size:19px; }
    h1 { margin:0; font-size:22px; }
    p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .tabs { display:flex; justify-content:center; padding:12px; color:var(--navy); font:700 11px/1 "JetBrains Mono",monospace; letter-spacing:.1em; text-transform:uppercase; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; background:#fff; }
    .tile { aspect-ratio:3/4; overflow:hidden; background:var(--social-paper-warm); }
    .tile img { width:100%; height:100%; display:block; object-fit:cover; }
    footer { padding:14px 24px 18px; background:radial-gradient(ellipse 120% 90% at 50% 4%, #fbfaf7, var(--social-paper-warm) 62%, var(--social-paper-edge)); color:var(--muted); font:600 11px/1.4 "JetBrains Mono",monospace; }
  </style>
</head>
<body class="social-editorial">
  <main class="phone">
    <header>
      <span class="status">Lote V1 · simulación · no publicada</span>
      <div class="profile"><div class="avatar">DTD</div><div><h1>@dtdcargo.ve</h1><p>Nueve publicaciones nuevas · recorte de perfil 3:4</p></div></div>
    </header>
    <div class="tabs">Publicaciones</div>
    <section class="grid">
      <article class="tile"><img src="exports/09-40hq-escala-real.png" alt="Publicación 09" /></article>
      <article class="tile"><img src="exports/08-del-puerto-a-tu-puerta.png" alt="Publicación 08" /></article>
      <article class="tile"><img src="exports/07-coordinacion-que-responde.png" alt="Publicación 07" /></article>
      <article class="tile"><img src="exports/06-recibimos-tu-contenedor.png" alt="Publicación 06" /></article>
      <article class="tile"><img src="exports/05-20gp-o-40hq.png" alt="Publicación 05" /></article>
      <article class="tile"><img src="exports/04-cada-caja-necesita-identidad.png" alt="Publicación 04" /></article>
      <article class="tile"><img src="exports/03-10-cbm.png" alt="Publicación 03" /></article>
      <article class="tile"><img src="exports/02-equipo-propio-china.png" alt="Publicación 02" /></article>
      <article class="tile"><img src="exports/01-cada-caja-empieza.png" alt="Publicación 01" /></article>
    </section>
    <footer>Validación local del recorte 3:4 contra las capturas reales del perfil entregadas el 2026-07-22. No se verificó la compresión final de Instagram.</footer>
  </main>
</body>
</html>
