<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vista general · Carrusel maestro DTD Cargo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0f1e3d; }
    .overview {
      width: 1200px;
      padding: 36px;
      display: grid;
      grid-template-columns: repeat(3, 360px);
      gap: 24px;
      background: #0f1e3d;
    }
    img {
      display: block;
      width: 360px;
      height: 450px;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
    }
  </style>
</head>
<body>
  <main class="overview">
    <img src="exports/01-portada.png" alt="Lámina 1" />
    <img src="exports/02-concepto.png" alt="Lámina 2" />
    <img src="exports/03-comparacion.png" alt="Lámina 3" />
    <img src="exports/04-20gp.png" alt="Lámina 4" />
    <img src="exports/05-40hq.png" alt="Lámina 5" />
    <img src="exports/06-cta.png" alt="Lámina 6" />
  </main>
</body>
</html>
