  <!-- pie -->
  <rect x="25" y="730" width="1350" height="220" rx="8" fill="#FFFFFF" stroke="#E8E6E2"/>
  <text x="45" y="760" class="d">Cómo se lee</text>
  <text x="45" y="785" class="t">• La Junta (Sam) guarda dinero real, producción, contratos, precios y la contratación de personas. El CEO agente dirige solo a los agentes.</text>
  <text x="45" y="808" class="t">• Meta del trimestre: una persona del equipo asume la Dirección General del día a día y Sam queda como Junta.</text>
  <text x="45" y="831" class="t">• Vacante #1: asesor comercial. Hoy las ventas las cubre Sam como interino y la IA de Kommo está apagada por costo.</text>
  <text x="45" y="854" class="t">• Nadie con más de tres puestos operativos; donde se concentran, el agente Jefe de gabinete toma el seguimiento.</text>
  <text x="45" y="877" class="t">• Externos sin cuenta en el ERP ni en Paperclip: operador de Yiwu, proveedores, agentes aduanales, transportistas, contadora y abogada.</text>
  <text x="45" y="900" class="t">• Separación de poderes: quien verifica no mueve el dinero; quien lo mueve tiene segunda firma de la Junta; quien dirige no es tesorero.</text>
  <text x="45" y="930" class="s">Fuente: docs/organizacion/organigrama-paperclip.md (sección 2.7). Los titulares viven en Studio › Nómina, no en este gráfico.</text>
