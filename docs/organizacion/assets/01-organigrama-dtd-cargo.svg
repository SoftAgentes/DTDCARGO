    <rect x="1125" y="470" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#D8D4CE"/>
    <text x="1137" y="491" class="d">Servidor e infraestructura</text><text x="1137" y="510" class="t">Sam</text>
    <rect x="1125" y="530" width="250" height="44" rx="6" fill="#FFFFFF" stroke="#7F0F1A" stroke-dasharray="5 4"/>
