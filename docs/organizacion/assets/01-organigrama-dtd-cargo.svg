  <rect width="1400" height="980" fill="#FBFAF7"/>
  <text x="30" y="40" style="font-size:22px;font-weight:800;fill:#0F1E3D">DTD Cargo · organigrama propuesto</text>
  <text x="30" y="62" class="s">Personas y agentes de IA · propuesta del 2026-10-19 · titulares por confirmar en Studio › Nómina</text>

