<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="Archivo, 'Segoe UI', Arial, sans-serif">
  <title>Organigrama propuesto de DTD Cargo · personas y agentes · 2026-10-19</title>
  <style>
