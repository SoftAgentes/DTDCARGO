  <path class="line" d="M700 128 V150"/>
  <path class="line" d="M700 222 V250 M150 250 H1250 M150 250 V280 M425 250 V280 M700 250 V280 M975 250 V280 M1250 250 V280"/>
  <path class="line" d="M560 186 H470 M840 186 H930"/>

  <!-- Junta -->
