    <rect x="575" y="470" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#D8D4CE"/>
    <text x="587" y="491" class="d">Contabilidad y fiscal</text><text x="587" y="510" class="t">Contadora externa</text>
    <rect x="575" y="530" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#D8D4CE"/>
