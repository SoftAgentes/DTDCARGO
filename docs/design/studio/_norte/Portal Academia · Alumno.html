<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal · Academia DTD (alumno)</title>
<link rel="stylesheet" href="erp/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800;900&family=Nunito+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #E7E5E0; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 16px 40px; box-sizing: border-box; min-height: 100vh; }
  .cap { text-align: center; }
  .cap .t { font: 800 14px/1.2 var(--f-display); color: var(--ink); }
  .cap .s { font: 500 12px/1.4 var(--f-sans); color: var(--ink-soft); margin-top: 4px; }
  /* control de prototipo (fuera del teléfono) */
  .proto { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1px solid var(--border); border-radius: var(--r-pill); box-shadow: var(--shadow-sm); }
  .proto button { border: 0; background: none; padding: 8px 16px; border-radius: var(--r-pill); font: 700 12.5px/1 var(--f-sans); color: var(--ink-soft); cursor: pointer; }
  .proto button.on { background: var(--wine); color: #fff; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="erp/icons.jsx"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="portal/academia-data.jsx"></script>
<script type="text/babel" src="portal/academia.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { IOSDevice, PortalAcademia } = window;
  const { useState } = React;
  function Stage() {
    const [gate, setGate] = useState(false);
    return (
      <React.Fragment>
        <div className="cap">
          <div className="t">Academia DTD · Portal del alumno</div>
          <div className="s">Mobile-first · navega con los tabs · prueba completar una lección</div>
        </div>
        <div className="proto" role="group" aria-label="Vista de prototipo">
          <button className={!gate ? 'on' : ''} onClick={() => setGate(false)}>Miembro</button>
          <button className={gate ? 'on' : ''} onClick={() => setGate(true)}>No-miembro (gate)</button>
        </div>
        <IOSDevice>
          <PortalAcademia key={gate ? 'g' : 'm'} gate={gate} topInset={52} bottomInset={26} />
        </IOSDevice>
      </React.Fragment>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
</script>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0F1E3D"/>
  <path d="M50 34 L74 44 L50 54 L26 44 Z" fill="#F2F0EC"/>
  <path d="M62 49 L62 60 Q50 67 38 60 L38 49" fill="none" stroke="#C2747F" stroke-width="3"/>
  <circle cx="50" cy="72" r="3.4" fill="#7F0F1A"/>
</svg>
</template>
</body>
</html>
