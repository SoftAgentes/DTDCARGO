  /* ── App-level layout ────────────────────────────────────── */
  .erp-app {
    min-height: 100vh;
    display: flex;
    background: var(--bg-base);
    color: var(--ink);
  }
  .erp-main {
    flex: 1;
    margin-left: var(--sb-expanded);
    transition: margin-left var(--dur) var(--ease);
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .erp-main.collapsed { margin-left: var(--sb-collapsed); }
  .erp-content {
    flex: 1;
    padding: var(--s-8);
    max-width: var(--content-max);
    width: 100%;
    margin: 0 auto;
  }
  /* ── Animations ──────────────────────────────────────────── */
  @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes erp-pop { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes erp-slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes erp-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes erp-route-in { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .erp-route { animation: erp-route-in 240ms var(--ease) both; }
</style>

<!-- App bootstrap -->
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const ERP_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "compact",
  "sidebarCollapsed": false,
  "showTweaks": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks
    ? window.useTweaks(ERP_DEFAULTS)
    : [ERP_DEFAULTS, () => {}];

  const [activeMod, setActiveMod] = useState('inicio');
  const [view, setView] = useState('list');       // 'list' | 'detail' | 'create' | 'edit'
  const [selectedId, setSelectedId] = useState(null);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(!!tweaks.sidebarCollapsed);
  const [currentUser, setCurrentUser] = useState(null);
  const [tenantTick, setTenantTick] = useState(0);
  const [portalInbox, setPortalInbox] = useState([]);

  // Bandeja del portal (registros, cotizaciones, re-compras entrantes).
  // Se suscribe al bridge compartido (localStorage) que publican el portal
  // web + móvil. Se filtra por tenant antes de mostrarse (multi-tenant).
  useEffect(() => {
    if (!window.DTDData || !window.DTDData.portalInbox) return;
    return window.DTDData.portalInbox.subscribe(list => setPortalInbox(list || []));
  }, []);

  // Re-render full ERP when the active tenant changes (multi-tenant)
  useEffect(() => {
    const onTenant = () => setTenantTick(t => t + 1);
    window.addEventListener('dtd-tenant-changed', onTenant);
    return () => window.removeEventListener('dtd-tenant-changed', onTenant);
  }, []);

  // Initialize current user from data (default Admin = Carlos V.)
  useEffect(() => {
    if (window.ERPData?.USERS && !currentUser) {
      // Aplicar overrides de perfil guardados (localStorage)
      try {
        window.ERPData.USERS.forEach(u => {
          const raw = localStorage.getItem('dtd_user_override_' + u.id);
          if (raw) { const o = JSON.parse(raw); if (o.name) u.name = o.name; if (o.email) u.email = o.email; if (o.phone) u.phone = o.phone; }
        });
      } catch (e) {}
      setCurrentUser(window.ERPData.USERS[0]);
    }
  }, [currentUser]);

  // Re-render cuando el perfil del usuario actual cambia (persistencia de "Mi perfil")
  useEffect(() => {
    const onUserUpdated = (e) => {
      const u = window.ERPData?.USERS?.find(x => x.id === e.detail);
      if (u) setCurrentUser({ ...u });
    };
    window.addEventListener('dtd-user-updated', onUserUpdated);
    return () => window.removeEventListener('dtd-user-updated', onUserUpdated);
  }, []);

  // When switching user, redirect to dashboard if module not allowed
  useEffect(() => {
    if (!currentUser) return;
    const allowed = window.ERPData?.ROLE_MODULES[currentUser.role];
    if (allowed && allowed !== '*' && !allowed.includes(activeMod)) {
      setActiveMod('dashboard');
    }
  }, [currentUser]);

  // Auto-switch to dashboard if active module gets disabled via feature flags
  useEffect(() => {
    const checkFlags = () => {
      if (window.DTDFlags && !window.DTDFlags.isModuleEnabled(activeMod)) {
        setActiveMod('dashboard');
      }
    };
    checkFlags();
    window.addEventListener('dtd-flags-changed', checkFlags);
    return () => window.removeEventListener('dtd-flags-changed', checkFlags);
  }, [activeMod]);

  // Apply theme + density to <html>
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.setAttribute('data-density', tweaks.density);
  }, [tweaks.theme, tweaks.density]);

  // ⌘K shortcut
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setPaletteOpen(v => !v);
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  // Navigate helper. Modules call goTo(moduleId, recordId?, view?)
  const goTo = useCallback((mod, id = null, v = id ? 'detail' : 'list') => {
    setActiveMod(mod);
    setSelectedId(id);
    setView(v);
    window.scrollTo({ top: 0 });
  }, []);

  const onPaletteSelect = useCallback((modId, recordId) => {
    setPaletteOpen(false);
    goTo(modId, recordId, recordId ? 'detail' : 'list');
  }, [goTo]);

  // Resolve module component
  // Expose goTo globally so child components can navigate without prop drilling
  window.__erpGoTo = goTo;
  window.__currentUser = currentUser;
  const moduleMap = {
    dashboard:  window.ModuleDashboard,
    shipments:  window.ModuleShipments,
    clients:    window.ModuleClients,
    quotes:     window.ModuleQuotes,
    tracking:   window.ModuleTracking,
    calendar:   window.ModuleCalendar,
    invoices:   window.ModuleInvoices,
    documents:  window.ModuleDocuments,
    cn:         window.ModuleCN,
    ve:         window.ModuleVE,
    despacho:   window.ModuleDespacho,
    'despacho-rules': window.ModuleDespachoRules,
    'despacho-dashboard': window.ModuleDespachoDashboard,
    'audit-log': window.ModuleAuditLog,
    rates:      window.ModuleServiciosTarifas || window.ModuleRates,
    users:      window.ModuleUsers,
    reports:    window.ModuleReports,
    costing:    window.ModuleCosting,
    tms:        window.ModuleTMS,
    suppliers:  window.ModuleSuppliers,
    seniat:     window.ModuleSENIAT,
    leads:      window.ModuleLeads,
    mailing:    window.ModuleMailing,
    admin:      window.ModuleAdmin,
    operarios:  window.ModuleOperariosPWA,
    vault:      window.ModuleVault,
    qrqueue:    window.ModuleQrQueue,
    reconcile:  window.ModuleConciliacion,
    contab:     window.ModuleContabilidad,
    tesoreria:  window.ModuleTesoreria,
    naviera:    window.ModuleNaviera,
    conversaciones: window.ModuleConversaciones,
    fidelizacion: window.ModuleFidelizacion,
    direccion:  window.ModuleDireccion,
    inicio:     window.ModuleInicio,
    cobranzas:  window.ModuleCobranzas,
    labels:     window.ModuleLabelGenerator,
  };
  const ActiveModule = moduleMap[activeMod];
  const moduleLabel = window.ERPShell.MODULES.find(m => m.id === activeMod)?.label || '—';

  return (
    <div className="erp-app">
      <window.ERPShell.Sidebar
        active={activeMod}
        onSelect={(id) => goTo(id)}
        collapsed={collapsed}
        onToggleCollapse={() => setCollapsed(c => !c)}
        currentUser={currentUser}
      />

      <div className={`erp-main ${collapsed ? 'collapsed' : ''}`}>
        <window.ERPShell.Topbar
          moduleLabel={moduleLabel}
          theme={tweaks.theme}
          onThemeToggle={() => setTweak('theme', tweaks.theme === 'dark' ? 'light' : 'dark')}
          onSearchFocus={() => setPaletteOpen(true)}
          notifications={(() => {
            const byT = window.ERPData.byTenant;
            const evts = byT(portalInbox).filter(e => !e.read);
            const rel = (iso) => {
              const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
              if (s < 60) return 'hace un momento';
              if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
              if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
              return 'hace ' + Math.floor(s / 86400) + ' d';
            };
            const portalNotifs = evts.map(e => ({
              id: e.id, t: e.title,
              m: (e.detail ? e.detail + ' · ' : '') + rel(e.ts),
              tone: e.tone || 'wine', portal: true, kind: e.kind, markbox: e.markbox,
            }));
            return [...portalNotifs, ...window.ERPData.NOTIFS];
          })()}
          onPortalAction={(n) => {
            if (window.DTDData?.markPortalRead) window.DTDData.markPortalRead([n.id]);
            const mod = n.kind === 'cotizacion' ? 'quotes' : n.kind === 'recompra' ? 'suppliers' : 'clients';
            goTo(mod);
          }}
          onPortalClear={() => { if (window.DTDData?.markPortalRead) window.DTDData.markPortalRead(); }}
          currentUser={currentUser}
          onSwitchUser={setCurrentUser}
        />

        {window.ERPShell.CompanyBanner && <window.ERPShell.CompanyBanner />}

        <main className="erp-content">
          <div className="erp-route" key={activeMod + view + (selectedId || '') + (currentUser?.id || '') + '|' + tenantTick}>
            {ActiveModule ? (
              <ActiveModule
                key={currentUser?.id || 'default'}
                goTo={goTo}
                view={view}
                setView={setView}
                selectedId={selectedId}
                setSelectedId={setSelectedId}
                currentUser={currentUser}
              />
            ) : (
              <window.ERPUI.EmptyState
                icon={window.Icon.warn(22)}
                title="Módulo no encontrado"
                body={`El módulo "${activeMod}" todavía no está cargado.`}
                action={<window.ERPUI.Btn variant="primary" onClick={() => goTo('dashboard')}>Volver al dashboard</window.ERPUI.Btn>}
              />
            )}
          </div>
        </main>
      </div>

      <window.ERPShell.CommandPalette
        open={paletteOpen}
        onClose={() => setPaletteOpen(false)}
        modules={window.ERPShell.MODULES}
        onSelect={onPaletteSelect}
      />

      <ERPTweaks tweaks={tweaks} setTweak={setTweak} />
      {window.ERPShell.OverlayHost && <window.ERPShell.OverlayHost />}
      {window.QuickEmailModal && <window.QuickEmailModal />}
      {window.DTDWiring && <window.DTDWiring.MountHost />}
    </div>
  );
}

// ── Tweaks panel ────────────────────────────────────────────
function ERPTweaks({ tweaks, setTweak }) {
  if (!window.TweaksPanel) return null;
  const { TweaksPanel, TweakSection, TweakRadio, TweakSelect, TweakToggle } = window;
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Apariencia">
        <TweakRadio label="Tema" value={tweaks.theme} options={[{value:'light',label:'Light'},{value:'dark',label:'Dark'}]} onChange={(v) => setTweak('theme', v)} />
        <TweakRadio label="Densidad" value={tweaks.density} options={[{value:'compact',label:'Compact'},{value:'comfortable',label:'Cómodo'},{value:'spacious',label:'Amplio'}]} onChange={(v) => setTweak('density', v)} />
      </TweakSection>
      <TweakSection title="Información">
        <div style={{ font: '500 12px/1.5 var(--f-sans)', color: 'var(--ink-soft)' }}>
          <b style={{ color: 'var(--ink)' }}>⌘ K</b> · paleta de comandos<br/>
          <b style={{ color: 'var(--ink)' }}>Esc</b> · cerrar drawers/modales<br/>
          <b style={{ color: 'var(--ink)' }}>Click row</b> · abrir detalle
        </div>
      </TweakSection>
    </TweaksPanel>
  );
}

</script>
