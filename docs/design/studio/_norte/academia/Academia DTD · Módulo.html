<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia DTD · Módulo</title>
<link rel="stylesheet" href="../erp/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Archivo+Black&family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg-base); color: var(--ink); font-family: var(--f-sans); }
  .topbar { height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 var(--s-8); background: var(--bg-sidebar); color: #F2F0EC; }
  .topbar img { width: 30px; }
  .topbar .wm { font-family: var(--f-brand-display); font-weight: 900; font-size: 17px; letter-spacing: -0.02em; }
  .topbar .wm .d { color: #F2F0EC; } .topbar .wm .g { color: #F2F0EC; } .topbar .wm .sp { display:inline-block; width:0.15em; }
  .topbar .mod { font: 600 13px/1 var(--f-sans); color: rgba(242,240,236,0.65); border-left: 1px solid rgba(242,240,236,0.2); padding-left: 14px; }
  .topbar .ver { margin-left: auto; font: 600 10px/1 var(--f-mono); color: rgba(242,240,236,0.6); background: rgba(242,240,236,0.1); padding: 5px 9px; border-radius: var(--r-pill); }

  .page { max-width: 1100px; margin: 0 auto; padding: var(--s-8) var(--s-8) var(--s-16); }
  .page > h1 { font: 700 26px/1.1 var(--f-display); margin: 0 0 var(--s-1); }
  .page > .lede { font: 400 14px/1.5 var(--f-sans); color: var(--ink-soft); margin: 0 0 var(--s-8); }

  /* KPIs */
  .kpirow { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-4); margin-bottom: var(--s-8); }
  .kpi { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--shadow-xs); }
  .kpi .v { font: 700 38px/1 var(--f-display); color: var(--wine); letter-spacing: -0.02em; }
  .kpi .k { font: 700 13px/1 var(--f-sans); color: var(--ink); margin-top: 8px; }
  .kpi .sub { font: 500 11px/1 var(--f-sans); color: var(--ink-mute); margin-top: 4px; }

  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 var(--s-4); }
  .sec-h h2, .sec-h h3 { font: 700 18px/1.2 var(--f-display); margin: 0; }
  .sec-h h3 { font-size: 15px; }
  .sec-h .hint { font: 400 12px/1.4 var(--f-sans); color: var(--ink-mute); }

  /* courses */
  .courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-5); }
  @media (max-width: 860px){ .courses { grid-template-columns: 1fr 1fr; } .kpirow { grid-template-columns: 1fr 1fr; } }
  .course { text-align: left; cursor: pointer; appearance: none; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--shadow-xs); transition: all .14s; display: flex; flex-direction: column; gap: 10px; }
  .course:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--ink-mute); }
  .c-top { display: flex; align-items: center; justify-content: space-between; }
  .c-date { font: 600 11px/1 var(--f-mono); color: var(--ink-mute); }
  .c-name { font: 700 17px/1.25 var(--f-display); color: var(--ink); }
  .c-meta { font: 500 12px/1.4 var(--f-sans); color: var(--ink-soft); }
  .c-foot { display: flex; align-items: center; justify-content: space-between; font: 600 12px/1 var(--f-sans); color: var(--ink-soft); border-top: 1px solid var(--border); padding-top: 10px; }
  .c-foot .ready { color: var(--success); }

  .badge { font: 700 9.5px/1 var(--f-sans); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: var(--r-pill); }
  .badge.wine { background: var(--wine-bg); color: var(--wine); } .badge.ok { background: var(--success-bg); color: var(--success); }
  .badge.mute { background: var(--bg-elevated); color: var(--ink-mute); }

  /* detail */
  .back { appearance: none; cursor: pointer; border: 0; background: transparent; color: var(--wine); font: 600 13px/1 var(--f-sans); padding: 0; margin-bottom: var(--s-5); }
  .d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: var(--s-8); }
  .d-eyebrow { font: 700 11px/1 var(--f-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--wine); margin-bottom: 8px; }
  .d-head h2 { font: 700 26px/1.1 var(--f-display); margin: 0; }
  .d-meta { font: 500 13px/1.4 var(--f-sans); color: var(--ink-soft); margin-top: 8px; }
  .emit { appearance: none; cursor: pointer; border: 0; background: var(--wine); color: #fff; font: 700 14px/1 var(--f-sans); padding: 14px 20px; border-radius: var(--r-md); display: inline-flex; align-items: center; gap: 9px; box-shadow: var(--shadow-sm); white-space: nowrap; }
  .emit:hover { background: var(--wine-deep); }
  .emit .cnt { background: rgba(255,255,255,0.22); border-radius: var(--r-pill); padding: 3px 9px; font: 700 12px/1 var(--f-mono); }

  /* roster table */
  .table { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .tr { display: grid; grid-template-columns: 2fr 1.2fr repeat(var(--ses,4), 52px) 60px 110px; align-items: center; border-bottom: 1px solid var(--border); }
  .tr:last-child { border-bottom: 0; }
  .tr.th { background: var(--bg-elevated); font: 700 10px/1 var(--f-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mute); }
  .tr.th > div { padding: 11px 10px; }
  .tr > div { padding: 11px 10px; font: 500 13px/1.3 var(--f-sans); }
  .nm { font-weight: 700; color: var(--ink); }
  .ci { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }
  .ses { text-align: center; }
  .ses.pct { font-family: var(--f-mono); font-weight: 600; color: var(--ink-soft); }
  .st { text-align: left; }
  .chk { appearance: none; cursor: pointer; width: 28px; height: 28px; border-radius: var(--r-sm); border: 1.5px solid var(--border); background: var(--bg-base); color: #fff; font-size: 14px; line-height: 1; }
  .chk.on { background: var(--success); border-color: var(--success); }
  .chk:hover { border-color: var(--ink-mute); }
</style>
</head>
<body>
  <div class="topbar">
    <img src="../assets/dtdcargo-isologo-reverse.png" alt="DTD" onerror="this.style.display='none'" />
    <span class="wm"><span class="d">DTD</span><span class="sp"></span><span class="g">Cargo</span></span>
    <span class="mod">Academia · Formación</span>
    <span class="ver">v4.5</span>
  </div>

  <div class="page">
    <h1>Academia DTD</h1>
    <p class="lede">Gestión de cursos y eventos de formación: inscritos, asistencia y emisión de diplomas. Al emitir, la lista de aprobados se precarga en el generador de diplomas.</p>
    <div id="app" style="--ses:4"></div>
  </div>

  <script>
    // ajustar columnas de asistencia por curso
    const obs = new MutationObserver(()=>{
      const ths = document.querySelectorAll('.tr.th .ses');
      const n = Array.from(ths).filter(e=>/^S\d/.test(e.textContent)).length;
      if (n) document.getElementById('app').style.setProperty('--ses', n);
    });
    obs.observe(document.getElementById('app'), { childList:true, subtree:true });
  </script>
  <script src="academia.js"></script>
</body>
</html>
