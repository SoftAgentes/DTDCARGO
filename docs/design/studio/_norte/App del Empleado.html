<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>DTD Cargo · App del Empleado · v1.0</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0F1E3D" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="erp/tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  /* Backdrop para encuadrar el teléfono en escritorio; en móvil ocupa todo */
  body {
    background: var(--bg-elevated);
    -webkit-tap-highlight-color: transparent;
    font-family: var(--f-sans);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  #root { width: 100%; display: flex; align-items: center; justify-content: center; }
  button { -webkit-tap-highlight-color: transparent; font-family: inherit; transition: opacity 0.15s ease, background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
  button:active:not(:disabled) { opacity: 0.78; }
  input, textarea { font-family: inherit; }
  *::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes erp-pop  { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes erp-slide-in { from { transform: translateX(28px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="erp/icons.jsx"></script>
<script type="text/babel" src="erp/data.jsx"></script>
<script type="text/babel" src="erp/components.jsx"></script>
<script type="text/babel" src="erp/rates.jsx"></script>
<script type="text/babel" src="erp/modules/nomina-data.jsx"></script>
<script type="text/babel" src="empleado/app.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.EmpleadoApp />);
</script>
</body>
</html>
