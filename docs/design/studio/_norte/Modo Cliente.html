<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modo Cliente · DTD-Cargo · v1.9.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="erp/tokens.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); font-family: var(--f-sans); }
    #mc-bar {
      height: 56px; display: flex; align-items: center; gap: 14px;
      padding: 0 20px; background: var(--ink); color: #fff;
      border-bottom: 2px solid var(--wine);
    }
    #mc-frame { width: 100%; height: calc(100% - 56px); border: 0; display: block; background: var(--bg-base); }
    .mc-eye {
      width: 30px; height: 30px; border-radius: var(--r-sm);
      background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .mc-label { font: 700 10px/1 var(--f-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--wine-soft); }
    .mc-sub { font: 500 12px/1.3 var(--f-sans); color: rgba(255,255,255,0.65); margin-top: 3px; }
    .mc-select {
      padding: 8px 30px 8px 12px; appearance: none; cursor: pointer;
      background: rgba(255,255,255,0.08) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23ffffff' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;
      border: 1px solid rgba(255,255,255,0.2); border-radius: var(--r-md);
      font: 700 13px/1 var(--f-sans); color: #fff; outline: none;
    }
    .mc-select option { color: var(--ink); }
    .mc-btn {
      padding: 8px 14px; border-radius: var(--r-md); cursor: pointer;
      font: 700 12.5px/1 var(--f-sans); border: 1px solid rgba(255,255,255,0.25);
      background: transparent; color: #fff; display: inline-flex; align-items: center; gap: 7px;
    }
    .mc-btn:hover { background: rgba(255,255,255,0.1); }
    .mc-btn.exit { background: var(--wine); border-color: var(--wine); }
    .mc-btn.exit:hover { background: var(--wine-deep); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="erp/icons.jsx"></script>
  <script type="text/babel" src="erp/data.jsx"></script>
</head>
<body>
  <div id="mc-root" style="height:100%;"></div>

  <script type="text/babel">
    const PORTAL = 'Portal del Cliente.html';

    function ModoCliente() {
      const D = window.ERPData;
      const I = window.Icon;
      const clients = D.CLIENTS.filter(c => c.status !== 'inactive');
      const startId = (() => {
        try { const a = new URLSearchParams(location.search).get('as'); return a || clients[0].markbox; }
        catch (e) { return clients[0].markbox; }
      })();
      const [markbox, setMarkbox] = React.useState(startId);
      const me = D.CLIENTS.find(c => c.markbox === markbox) || clients[0];

      const src = `${PORTAL}?as=${encodeURIComponent(markbox)}`;

      return (
        <React.Fragment>
          <div id="mc-bar">
            <span className="mc-eye">{I.eye ? I.eye(15) : '👁'}</span>
            <div>
              <div className="mc-label">Modo cliente · vista previa</div>
              <div className="mc-sub">Estás viendo el portal exactamente como <strong style={{ color: '#fff' }}>{me.name}</strong></div>
            </div>

            <div style={{ flex: 1 }} />

            <span style={{ font: '600 11px/1 var(--f-sans)', color: 'rgba(255,255,255,0.55)' }}>Cliente:</span>
            <select className="mc-select" value={markbox} onChange={(e) => { setMarkbox(e.target.value); history.replaceState(null, '', `?as=${e.target.value}`); }}>
              {clients.map(c => <option key={c.markbox} value={c.markbox}>{c.markbox} · {c.name}</option>)}
            </select>

            <a className="mc-btn exit" href="DTD Studio · ERP.html" style={{ textDecoration: 'none' }}>
              {I.arrowL ? I.arrowL(13) : '←'} Salir del modo
            </a>
          </div>

          <iframe id="mc-frame" src={src} title="Portal del cliente" key={markbox}></iframe>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('mc-root')).render(<ModoCliente />);
  </script>
</body>
</html>
