<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard de Proveedores · DTD-Cargo</title>
<link rel="stylesheet" href="../erp/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Archivo+Black&family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg-base); color: var(--ink); font-family: var(--f-sans); }
  .topbar { height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 var(--s-8); background: var(--bg-sidebar); color: #F2F0EC; }
  .topbar img { width: 30px; }
  .topbar .wm { font-family: var(--f-brand-display); font-weight: 900; font-size: 17px; letter-spacing: -0.02em; }
  .topbar .wm .d { color: var(--wine-soft); } .topbar .wm .g { color: #F2F0EC; } .topbar .wm .sp { display:inline-block; width:0.15em; }
  .topbar .mod { font: 600 13px/1 var(--f-sans); color: rgba(242,240,236,0.65); border-left: 1px solid rgba(242,240,236,0.2); padding-left: 14px; }
  .topbar .ver { margin-left: auto; font: 600 10px/1 var(--f-mono); color: rgba(242,240,236,0.6); background: rgba(242,240,236,0.1); padding: 5px 9px; border-radius: var(--r-pill); }

  .page { max-width: 1100px; margin: 0 auto; padding: var(--s-8) var(--s-8) var(--s-16); }
  .page > h1 { font: 700 26px/1.1 var(--f-display); margin: 0 0 var(--s-1); }
  .page > .lede { font: 400 14px/1.5 var(--f-sans); color: var(--ink-soft); margin: 0 0 var(--s-6); }

  .tabs { display: flex; gap: var(--s-2); margin-bottom: var(--s-6); }
  .tab { appearance: none; cursor: pointer; font: 600 13px/1 var(--f-sans); padding: 10px 16px; border-radius: var(--r-pill); background: var(--bg-surface); color: var(--ink-soft); border: 1px solid var(--border); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab .cnt { background: var(--wine); color: #fff; border-radius: var(--r-pill); padding: 2px 7px; font: 700 10px/1 var(--f-mono); margin-left: 5px; }

  .kpirow { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-4); margin-bottom: var(--s-6); }
  .kpi { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--shadow-xs); }
  .kpi .v { font: 700 36px/1 var(--f-display); color: var(--wine); letter-spacing: -0.02em; }
  .kpi .k { font: 700 13px/1 var(--f-sans); color: var(--ink); margin-top: 8px; }
  .kpi .sub { font: 500 11px/1 var(--f-sans); color: var(--ink-mute); margin-top: 4px; }
  @media (max-width: 860px){ .kpirow { grid-template-columns: 1fr 1fr; } }

  .table { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg-surface); }
  .table.sup .tr { grid-template-columns: 2.2fr 1.1fr 0.8fr 0.9fr 0.9fr 0.9fr 1fr; }
  .table.claims .tr { grid-template-columns: 1.1fr 1.6fr 1.1fr 0.9fr 0.8fr 1fr 1.1fr; }
  .tr { display: grid; align-items: center; border-bottom: 1px solid var(--border); text-align: left; width: 100%; }
  .tr:last-child { border-bottom: 0; }
  .tr.th { background: var(--bg-elevated); font: 700 10px/1 var(--f-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mute); }
  .tr.th > div { padding: 11px 12px; }
  .tr > div { padding: 12px; font: 500 13px/1.3 var(--f-sans); }
  button.tr.row { appearance: none; background: var(--bg-surface); border-left: 0; border-right: 0; cursor: pointer; }
  button.tr.row:hover { background: var(--bg-elevated); }
  .r { text-align: right; } .c { text-align: center; }
  .mono { font-family: var(--f-mono); }
  .nm { font-weight: 700; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
  .nm .sub { font: 500 11px/1 var(--f-sans); color: var(--ink-mute); }
  .grade { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: var(--r-sm); font: 800 13px/26px var(--f-display); margin-right: 7px; }
  .scn { font: 600 12px var(--f-mono); color: var(--ink-soft); }
  .grade.ok { background: var(--success-bg); color: var(--success); } .grade.info { background: var(--info-bg); color: var(--info); }
  .grade.warn { background: var(--warning-bg); color: var(--warning); } .grade.danger { background: var(--danger-bg); color: var(--danger); }

  .badge { font: 700 9.5px/1 var(--f-sans); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: var(--r-pill); }
  .badge.ok { background: var(--success-bg); color: var(--success); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.wine { background: var(--wine-bg); color: var(--wine); } .badge.mute { background: var(--bg-elevated); color: var(--ink-mute); }

  /* detail */
  .back { appearance: none; cursor: pointer; border: 0; background: transparent; color: var(--wine); font: 600 13px/1 var(--f-sans); padding: 0; margin-bottom: var(--s-5); }
  .d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: var(--s-6); }
  .d-eyebrow { font: 700 11px/1 var(--f-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--wine); margin-bottom: 8px; }
  .d-head h2 { font: 700 26px/1.1 var(--f-display); margin: 0; }
  .d-meta { font: 500 13px/1.4 var(--f-sans); color: var(--ink-soft); margin-top: 8px; }
  .big-grade { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 20px; border-radius: var(--r-lg); }
  .big-grade.ok { background: var(--success-bg); } .big-grade.info { background: var(--info-bg); } .big-grade.warn { background: var(--warning-bg); } .big-grade.danger { background: var(--danger-bg); }
  .big-grade .bg { font: 800 44px/1 var(--f-display); }
  .big-grade.ok .bg { color: var(--success); } .big-grade.info .bg { color: var(--info); } .big-grade.warn .bg { color: var(--warning); } .big-grade.danger .bg { color: var(--danger); }
  .big-grade .bs { font: 600 12px/1 var(--f-mono); color: var(--ink-soft); }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-6); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-6); margin-bottom: var(--s-8); }
  @media (max-width: 760px){ .metrics { grid-template-columns: 1fr; } }
  .mb-h { display: flex; justify-content: space-between; font: 600 13px/1 var(--f-sans); color: var(--ink); margin-bottom: 9px; }
  .mb-v { font-family: var(--f-mono); color: var(--ink-soft); }
  .mb-t { height: 9px; background: var(--bg-elevated); border-radius: 999px; overflow: hidden; }
  .mb-f { height: 100%; border-radius: 999px; }
  .mb-f.ok { background: var(--success); } .mb-f.info { background: var(--info); } .mb-f.warn { background: var(--warning); } .mb-f.danger { background: var(--danger); }

  .sec-h { margin: 0 0 var(--s-4); }
  .sec-h h3 { font: 700 16px/1.2 var(--f-display); margin: 0; }
  .empty { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-8); text-align: center; color: var(--ink-mute); font: 500 14px var(--f-sans); }
</style>
</head>
<body>
  <div class="topbar">
    <img src="../assets/dtdcargo-isologo-reverse.png" alt="DTD" onerror="this.style.display='none'" />
    <span class="wm"><span class="d">DTD</span><span class="sp"></span><span class="g">Cargo</span></span>
    <span class="mod">Proveedores · Scorecard</span>
    <span class="ver">v4.3</span>
  </div>
  <div class="page">
    <h1>Scorecard de proveedores</h1>
    <p class="lede">Desempeño de cada proveedor en China: puntualidad, calidad, tasa de rechazo y rating — más la gestión de reclamos. Tocá un proveedor para ver el detalle.</p>
    <div id="app"></div>
  </div>
  <script src="scorecard.js"></script>
</body>
</html>
