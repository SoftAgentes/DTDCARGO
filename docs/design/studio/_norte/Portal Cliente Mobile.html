<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DTD-Cargo · Portal Cliente · Móvil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0F1E3D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DTD-Cargo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/pwa-icon-512.png">
  <link rel="stylesheet" href="erp/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { background: var(--bg-base); overscroll-behavior: contain; -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; }
    #root { min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg-base); position: relative; }
    @media (min-width: 481px) {
      body { background: var(--bg-sidebar); padding: 24px 0; }
      #root { box-shadow: 0 12px 60px rgba(0,0,0,0.35); border-radius: 26px; overflow: hidden; min-height: calc(100vh - 48px); }
    }
    @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes erp-pop  { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes erp-route-in { from { transform: translateY(8px); } to { transform: translateY(0); } }
    @keyframes mobile-bounce-in { 0% { transform: translateY(24px); } 60% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
    @keyframes erp-spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="erp/icons.jsx"></script>
  <script type="text/babel" src="erp/data.jsx"></script>
  <script type="text/babel" src="erp/data-bridge.jsx"></script>
  <script type="text/babel" src="erp/components.jsx"></script>
  <script type="text/babel" src="erp/search-select.jsx"></script>
  <script type="text/babel" src="portal/mobile-extra.jsx"></script>
  <script type="text/babel" src="portal/mobile.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.PortalMobileApp />);
  </script>
  <script>
    // ── PWA · registro del service worker ──────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    // ── Banner "Instalar app" (Android/Chrome beforeinstallprompt) ──
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        showInstallBanner();
      });
      function showInstallBanner() {
        if (document.getElementById('dtd-install-banner')) return;
        var b = document.createElement('div');
        b.id = 'dtd-install-banner';
        b.setAttribute('style', [
          'position:fixed', 'left:50%', 'transform:translateX(-50%)',
          'bottom:calc(80px + env(safe-area-inset-bottom))', 'z-index:80',
          'width:min(440px,calc(100% - 24px))', 'display:flex', 'align-items:center', 'gap:12px',
          'padding:12px 14px', 'background:var(--bg-sidebar)', 'color:#fff',
          'border-radius:var(--r-xl)', 'box-shadow:0 12px 40px rgba(0,0,0,0.35)',
          'font-family:var(--f-sans)', 'animation:mobile-bounce-in 320ms ease both'
        ].join(';'));
        b.innerHTML =
          '<img src="assets/pwa-icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px;flex-shrink:0">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-weight:800;font-size:13px;line-height:1.2">Instalá DTD-Cargo</div>' +
            '<div style="font-size:11.5px;line-height:1.3;color:rgba(255,255,255,0.65);margin-top:2px">Acceso directo, como una app.</div>' +
          '</div>' +
          '<button id="dtd-install-go" style="flex-shrink:0;padding:9px 14px;border:0;border-radius:var(--r-md);background:var(--wine);color:#fff;font:800 12.5px/1 var(--f-sans)">Instalar</button>' +
          '<button id="dtd-install-x" aria-label="Cerrar" style="flex-shrink:0;width:28px;height:28px;border:0;border-radius:var(--r-pill);background:rgba(255,255,255,0.1);color:#fff;font-size:15px">×</button>';
        document.body.appendChild(b);
        document.getElementById('dtd-install-x').onclick = function () { b.remove(); };
        document.getElementById('dtd-install-go').onclick = function () {
          b.remove();
          if (deferred) { deferred.prompt(); deferred = null; }
        };
      }
    })();
  </script>
</body>
</html>
