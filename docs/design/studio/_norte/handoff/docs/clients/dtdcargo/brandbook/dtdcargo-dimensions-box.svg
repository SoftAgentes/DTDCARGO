<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet" font-family="Archivo, system-ui, sans-serif">
  <title>DTD-Cargo · dimensiones de caja</title>

  <defs>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF7"></stop>
      <stop offset="1" stop-color="#E8E6E2"></stop>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#E8E6E2"></stop>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D5CE"></stop>
      <stop offset="1" stop-color="#B5B0A8"></stop>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"></feGaussianBlur>
      <feOffset dx="0" dy="14"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <ellipse cx="300" cy="430" rx="180" ry="14" fill="rgba(15,30,61,0.15)"></ellipse>

  
  <g filter="url(#boxShadow)">
    
    <polygon points="130,180 220,110 480,110 390,180" fill="url(#boxTop)" stroke="#0F1E3D" stroke-width="2" stroke-linejoin="round"></polygon>
    
    <polygon points="390,180 480,110 480,310 390,380" fill="url(#boxSide)" stroke="#0F1E3D" stroke-width="2" stroke-linejoin="round"></polygon>
    
    <polygon points="130,180 390,180 390,380 130,380" fill="url(#boxFront)" stroke="#0F1E3D" stroke-width="2" stroke-linejoin="round"></polygon>
    
    <line x1="130" y1="280" x2="390" y2="280" stroke="rgba(15,30,61,0.12)" stroke-width="1.5"></line>
    <line x1="260" y1="180" x2="260" y2="380" stroke="rgba(15,30,61,0.08)" stroke-width="1"></line>
  </g>

  
  <g>
    
    <line x1="130" y1="412" x2="390" y2="412" stroke="#7F0F1A" stroke-width="2.2" stroke-linecap="round"></line>
    
    <polyline points="140,406 130,412 140,418" fill="none" stroke="#7F0F1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <polyline points="380,406 390,412 380,418" fill="none" stroke="#7F0F1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <line x1="130" y1="380" x2="130" y2="420" stroke="#7F0F1A" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="390" y1="380" x2="390" y2="420" stroke="#7F0F1A" stroke-width="1" stroke-dasharray="2 3"></line>
    
    <rect x="232" y="436" width="96" height="28" rx="14" fill="#7F0F1A"></rect>
    <text x="280" y="454" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="14" fill="#FFFFFF" letter-spacing="0.06em">LARGO</text>
  </g>

  
  <g>
    
    <line x1="110" y1="180" x2="110" y2="380" stroke="#0F1E3D" stroke-width="2.2" stroke-linecap="round"></line>
    
    <polyline points="104,190 110,180 116,190" fill="none" stroke="#0F1E3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <polyline points="104,370 110,380 116,370" fill="none" stroke="#0F1E3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <line x1="130" y1="180" x2="100" y2="180" stroke="#0F1E3D" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="130" y1="380" x2="100" y2="380" stroke="#0F1E3D" stroke-width="1" stroke-dasharray="2 3"></line>
    
    <rect x="32" y="266" width="68" height="28" rx="14" fill="#0F1E3D"></rect>
    <text x="66" y="284" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="14" fill="#FFFFFF" letter-spacing="0.06em">ALTO</text>
  </g>

  
  <g>
    
    <line x1="408" y1="170" x2="498" y2="100" stroke="#B8893A" stroke-width="2.2" stroke-linecap="round"></line>
    
    <polyline points="416,162 408,170 418,172" fill="none" stroke="#B8893A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <polyline points="488,98 498,100 496,108" fill="none" stroke="#B8893A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    
    <line x1="390" y1="180" x2="408" y2="170" stroke="#B8893A" stroke-width="1" stroke-dasharray="2 3"></line>
    <line x1="480" y1="110" x2="498" y2="100" stroke="#B8893A" stroke-width="1" stroke-dasharray="2 3"></line>
    
    <rect x="500" y="100" width="84" height="28" rx="14" fill="#B8893A"></rect>
    <text x="542" y="118" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="14" fill="#FFFFFF" letter-spacing="0.06em">ANCHO</text>
  </g>

  
  <g opacity="0.55">
    <text x="260" y="260" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="38" letter-spacing="-1">
      <tspan fill="#7F0F1A">DTD</tspan><tspan fill="#0F1E3D">·</tspan>
    </text>
    <text x="260" y="296" text-anchor="middle" font-family="Archivo Black, sans-serif" font-size="22" fill="#0F1E3D" letter-spacing="-0.5">CARGO</text>
  </g>

  
  <text x="300" y="488" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="500" font-size="13" fill="#6B6B6B" letter-spacing="0.04em">
    Medí cada caja en centímetros · L × A × H
  </text>
</svg>