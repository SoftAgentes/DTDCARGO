<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<title>DTD-Cargo · Registro de cliente · v4.3</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="erp/tokens.css" />
<style>
  body { background: var(--bg-base); }
  @keyframes erp-pop { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes erp-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes guide-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(127,15,26,0); } 50% { box-shadow: 0 0 0 8px rgba(127,15,26,0.18); } }
  @keyframes guide-arrow-h { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
  .guide-pulse { animation: guide-glow 2s ease-in-out infinite; }
  .guide-pulse:hover { animation: none; background: var(--wine-tint) !important; }
  .guide-arrow-bounce { animation: guide-arrow-h 1.6s ease-in-out infinite; }

  /* ── Celebración · la tarjeta Shipping Mark al registrar la compra ── */
  @keyframes markbox-pop { 0% { transform: scale(1); } 28% { transform: scale(1.045); } 62% { transform: scale(0.992); } 100% { transform: scale(1); } }
  @keyframes markbox-ring {
    0%   { box-shadow: var(--shadow-lg), 0 0 0 0 rgba(31,138,91,0.55); }
    70%  { box-shadow: var(--shadow-lg), 0 0 0 18px rgba(31,138,91,0); }
    100% { box-shadow: var(--shadow-lg), 0 0 0 0 rgba(31,138,91,0); }
  }
  .markbox-card.celebrate { animation: markbox-pop 620ms var(--ease) both, markbox-ring 1600ms ease-out 1; }
  @keyframes markbox-badge-in { from { opacity: 0; transform: scale(0.4) rotate(-18deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  .markbox-badge { animation: markbox-badge-in 520ms 180ms var(--ease) both; }
  @keyframes markbox-code-swap { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
  .markbox-code.swap { display: inline-block; animation: markbox-code-swap 520ms var(--ease) both; }
  .markbox-shimmer { position: absolute; inset: 0; overflow: hidden; border-radius: var(--r-lg); pointer-events: none; }
  .markbox-shimmer::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 38%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: translateX(-130%); animation: markbox-shimmer-sweep 1100ms 240ms ease-out 1;
  }
  @keyframes markbox-shimmer-sweep { to { transform: translateX(230%); } }
  @keyframes celebrate-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .celebrate-banner { animation: celebrate-rise 520ms 140ms var(--ease) both; }
  @media (prefers-reduced-motion: reduce) {
    .markbox-card.celebrate, .markbox-badge, .markbox-code.swap, .markbox-shimmer::before, .celebrate-banner { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="erp/icons.jsx"></script>
<script type="text/babel" src="erp/data.jsx"></script>
<script type="text/babel" src="erp/data-bridge.jsx"></script>
<script type="text/babel" src="erp/components.jsx"></script>
<script type="text/babel" src="erp/modules/venezuela-catalog.jsx"></script>
<script type="text/babel" src="portal/registro.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById('root')).render(<window.RegistroCliente />);</script>
</body>
</html>
