<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DTD-Cargo · Mobile ERP · v4.5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0F1E3D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="erp/tokens.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@500;600;700;800&display=swap">
  <style>
    html, body { background: var(--bg-base); overscroll-behavior: contain; }
    #root { min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg-base); position: relative; }
    @media (min-width: 481px) {
      body { background: var(--bg-sidebar); padding: 24px 0; }
      #root { box-shadow: 0 12px 60px rgba(0,0,0,0.35); border-radius: 22px; overflow: hidden; min-height: calc(100vh - 48px); }
    }
    @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes erp-pop  { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes erp-slide-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes erp-shimmer { from { background-position: 0% 0%; } to { background-position: -200% 0%; } }
    @keyframes mobile-bounce-in { 0% { opacity: 0; transform: translateY(20px); } 60% { transform: translateY(-3px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="erp/icons.jsx"></script>
  <script type="text/babel" src="erp/data.jsx"></script>
  <script type="text/babel" src="erp/rates.jsx"></script>
  <script type="text/babel" src="mobile/app.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);
  </script>
</body>
</html>
