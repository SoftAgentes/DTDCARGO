<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclo del Cliente · DTD-Cargo</title>
<link rel="stylesheet" href="../erp/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-base); }
  #root { height: 100vh; }

  /* ── Marco común del ciclo ── */
  .cyc-frame {
    position: relative; width: 640px; height: 640px;
    background: linear-gradient(135deg, var(--ink), #1F3055);
    overflow: hidden; color: #F2F0EC;
    font-family: var(--f-sans);
  }
  .cyc-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── Contenedor de fondo (C) ── */
  .cyc-frame--container { --bg-strength: 0.30; }
  .cyc-bg-container {
    position: absolute; left: 50%; top: 53%;
    width: 132%; transform: translate(-50%, -50%) rotate(-3deg);
    opacity: var(--bg-strength);
    filter: saturate(0.72) brightness(0.92);
    pointer-events: none; user-select: none;
  }
  /* velo navy para que la cinta y el texto manden por encima del contenedor */
  .cyc-bg-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(58% 58% at 50% 50%, rgba(15,30,61,0.30) 0%, rgba(15,30,61,0.74) 62%, rgba(11,20,40,0.88) 100%),
      linear-gradient(135deg, rgba(15,30,61,0.30), rgba(31,48,85,0.30));
  }

  /* anillo (A) */
  .cyc-ring-bg { fill: none; stroke: rgba(242,240,236,0.10); stroke-width: 2; }
  .cyc-ring-flow {
    fill: none; stroke: var(--wine-soft); stroke-width: 2.5;
    stroke-dasharray: 6 14; stroke-linecap: round; opacity: 0.9;
  }
  /* órbita (B) */
  .cyc-orbit { fill: none; stroke: rgba(194,116,127,0.45); stroke-width: 2; stroke-dasharray: 5 13; }
  /* track (C) */
  .cyc-track-bg { fill: none; stroke: rgba(242,240,236,0.10); stroke-width: 16; }
  .cyc-track-flow { fill: none; stroke: rgba(194,116,127,0.55); stroke-width: 2.5; stroke-dasharray: 6 14; stroke-linecap: round; }

  /* punto viajero (A) */
  .cyc-spark {
    position: absolute; width: 16px; height: 16px; border-radius: 999px;
    background: #F2F0EC; box-shadow: 0 0 18px 5px rgba(242,240,236,0.55);
    offset-distance: 8%; offset-rotate: 0deg; margin: -8px;
  }
  /* cometa (B) */
  .cyc-comet {
    position: absolute; width: 14px; height: 14px; border-radius: 999px;
    background: var(--wine-soft); box-shadow: 0 0 16px 5px rgba(194,116,127,0.6);
    offset-distance: 6%; margin: -7px;
  }
  /* contenedor en cinta (C) */
  .cyc-belt {
    position: absolute; offset-distance: 4%; offset-rotate: auto;
    margin: -15px -22px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
  }

  @media (prefers-reduced-motion: no-preference) {
    .cyc-ring-flow, .cyc-track-flow { animation: cyc-march 1.4s linear infinite; }
    .cyc-orbit { animation: cyc-march 1.8s linear infinite; }
    .cyc-spark { animation: cyc-travel 9s linear infinite; }
    .cyc-comet { animation: cyc-travel 11s linear infinite; }
    .cyc-belt  { animation: cyc-travel 12s linear infinite; }
    .cyc-loopicon { animation: cyc-rotate 14s linear infinite; }
  }
  @keyframes cyc-travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @keyframes cyc-march  { to { stroke-dashoffset: -40; } }
  @keyframes cyc-rotate { to { transform: rotate(360deg); } }

  /* ── Nodos (A) ── */
  .cyc-node {
    position: absolute; transform: translate(-50%, -50%);
    width: 104px; height: 104px; border-radius: 999px;
    background: var(--wine); border: 1.5px solid rgba(242,240,236,0.14);
    box-shadow: 0 8px 22px rgba(0,0,0,0.32);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: #F2F0EC; text-align: center;
  }
  .cyc-node-num {
    position: absolute; top: -7px; right: -7px; width: 26px; height: 26px; border-radius: 999px;
    background: #F2F0EC; color: var(--wine); font: 800 13px/26px var(--f-display); text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .cyc-node-ico { color: #F2F0EC; height: 28px; }
  .cyc-node-lbl { font: 700 15px/1 var(--f-display); letter-spacing: -0.01em; }
  .cyc-node-sub { font: 600 9.5px/1 var(--f-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine-soft); }

  /* ── Centro (A y C) ── */
  .cyc-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; width: 220px;
  }
  .cyc-loopicon { color: var(--wine-soft); display: inline-flex; }
  .cyc-eyebrow { font: 700 11px/1 var(--f-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--wine-soft); }
  .cyc-tagline { font: 700 26px/1.08 var(--f-display); color: #F2F0EC; letter-spacing: -0.01em; }
  .cyc-tagline--sm { font-size: 18px; }
  .cyc-center--track { width: 200px; }

  /* ── Hub isólogo (B) ── */
  .cyc-hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  .cyc-hub img { width: 116px; height: auto; opacity: 0.96; }
  .cyc-hub-tag { font: 700 16px/1.12 var(--f-display); color: #F2F0EC; letter-spacing: -0.01em; }

  /* ── Chips orbitales (B) ── */
  .cyc-chip {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 9px;
    background: rgba(15,30,61,0.78); border: 1px solid rgba(194,116,127,0.30);
    padding: 9px 13px 9px 9px; border-radius: var(--r-pill);
    box-shadow: 0 8px 20px rgba(0,0,0,0.30); white-space: nowrap;
  }
  .cyc-chip-ico {
    width: 36px; height: 36px; border-radius: 999px; background: var(--wine); color: #F2F0EC;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .cyc-chip-txt { display: flex; flex-direction: column; gap: 1px; }
  .cyc-chip-lbl { font: 700 14px/1 var(--f-display); color: #F2F0EC; display: flex; align-items: baseline; gap: 6px; }
  .cyc-chip-lbl b { font: 800 11px/1 var(--f-display); color: var(--wine-soft); }
  .cyc-chip-sub { font: 600 9px/1 var(--f-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine-soft); }

  /* ── Estaciones (C) ── */
  .cyc-stn { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cyc-stn--bot { flex-direction: column-reverse; }
  .cyc-stn-dot {
    width: 52px; height: 52px; border-radius: 999px; background: var(--wine); color: #F2F0EC;
    display: flex; align-items: center; justify-content: center; border: 1.5px solid rgba(242,240,236,0.16);
    box-shadow: 0 6px 16px rgba(0,0,0,0.3); flex: 0 0 auto;
  }
  .cyc-stn-txt { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .cyc-stn-lbl { font: 700 14px/1 var(--f-display); color: #F2F0EC; display: flex; align-items: baseline; gap: 6px; }
  .cyc-stn-lbl b { font: 800 11px/1 var(--f-display); color: var(--wine-soft); }
  .cyc-stn-sub { font: 600 9px/1 var(--f-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--wine-soft); }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0F1E3D"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#C2747F" stroke-width="3" stroke-dasharray="4 6"/>
      <circle cx="50" cy="24" r="6" fill="#7F0F1A"/>
      <circle cx="76" cy="50" r="6" fill="#7F0F1A"/>
      <circle cx="50" cy="76" r="6" fill="#7F0F1A"/>
      <circle cx="24" cy="50" r="6" fill="#7F0F1A"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="cycles.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="ciclo-c" title="C · Cinta con contenedor" subtitle="El contenedor de marca detrás del ciclo · comparando intensidades">
            <DCArtboard id="c-30" label="Contenedor 30% (recomendado)" width={640} height={640}>
              <OptionC strength={0.30} />
            </DCArtboard>
            <DCArtboard id="c-45" label="Contenedor 45% (más presente)" width={640} height={640}>
              <OptionC strength={0.45} />
            </DCArtboard>
            <DCArtboard id="c-18" label="Contenedor 18% (apenas insinuado)" width={640} height={640}>
              <OptionC strength={0.18} />
            </DCArtboard>
            <DCArtboard id="c-plain" label="Sin contenedor (referencia)" width={640} height={640}>
              <OptionC showContainer={false} />
            </DCArtboard>
          </DCSection>
          <DCSection id="ciclo" title="Las otras dos opciones" subtitle="Por si querés comparar">
            <DCArtboard id="a" label="A · Anillo de proceso" width={640} height={640}>
              <OptionA />
            </DCArtboard>
            <DCArtboard id="b" label="B · Órbita del isólogo" width={640} height={640}>
              <OptionB />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
