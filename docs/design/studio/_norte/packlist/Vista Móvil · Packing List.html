<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista móvil · Packing List · DTD-Cargo</title>
<link rel="stylesheet" href="../erp/tokens.css">
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg-elevated);
    font-family: var(--f-sans); display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 16px 48px; box-sizing: border-box; }
  .head { text-align: center; max-width: 420px; }
  .head .eb { font: 700 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--wine); }
  .head h1 { font: 700 21px/1.2 var(--f-display); color: var(--ink); margin: 8px 0 5px; }
  .head p { font: 500 13px/1.5 var(--f-sans); color: var(--ink-soft); margin: 0; }

  .phone { width: 390px; height: 800px; background: #0b0b0d; border-radius: 52px; padding: 13px;
    box-shadow: 0 30px 70px -24px rgba(15,30,61,.55), 0 0 0 2px #2a2a2e; position: relative; flex: none; }
  .phone .screen { width: 100%; height: 100%; background: #fff; border-radius: 40px; overflow: hidden; position: relative; }
  .phone .notch { position: absolute; top: 13px; left: 50%; transform: translateX(-50%); width: 122px; height: 32px;
    background: #0b0b0d; border-radius: 0 0 18px 18px; z-index: 5; }
  .phone iframe { width: 390px; height: 774px; border: 0; transform: scale(0.933); transform-origin: top left; }
  /* iframe is 390 wide; screen inner is ~364 → scale to fit */
  .phone .screen-inner { position: absolute; inset: 0; }
  .phone iframe { width: 390px; height: 830px; border: 0; }
  .hint { font: 500 12px/1.5 var(--f-sans); color: var(--ink-mute); max-width: 360px; text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <div class="eb">Vista previa · móvil</div>
    <h1>Packing List en el teléfono</h1>
    <p>Así lo ve el proveedor cuando abre el link desde el celular. La tabla de mercancía se desplaza en horizontal; los datos y botones se apilan.</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="screen-inner">
        <iframe src="Packing List + Factura · DTD-Cargo.html" title="Packing List móvil"></iframe>
      </div>
    </div>
  </div>

  <p class="hint">Es el mismo documento responsivo — no una versión aparte. Tocá dentro para interactuar.</p>
</body>
</html>
