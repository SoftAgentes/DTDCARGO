<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Brand Book DTD v2.4 · Portal + Sistema de diseño · DTD-CARGO</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
/* ── DTD·CARGO design tokens ───────────────────────────────── */
:root {
  --wine: #7F0F1A;
  --wine-deep: #5E0A12;
  --wine-soft: #C2747F;

  --ink: #0F1E3D;
  --grey-900: #1F1F1F;
  --grey-700: #333333;
  --grey-500: #6B6B6B;
  --grey-300: #C9C5BE;
  --grey-200: #E8E6E2;
  --grey-100: #F2F0EC;
  --paper:    #FBFAF7;
  --white:    #FFFFFF;

  --gutter: clamp(20px, 4vw, 64px);
  --maxw: 1280px;

  /* ── Sombras estándar (v1.1 · TODAS las ventanas) ──
     Una sola fuente de verdad. Cambiar acá afecta todo el brand book. */
  --card-shadow:
    0 2px 4px rgba(15,30,61,0.08),
    0 8px 16px rgba(15,30,61,0.10),
    0 24px 48px -16px rgba(15,30,61,0.22);
  --card-shadow-hover:
    0 4px 8px rgba(15,30,61,0.10),
    0 12px 24px rgba(15,30,61,0.14),
    0 32px 60px -18px rgba(15,30,61,0.32);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Archivo', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

/* ── Type scale ─────────────────────────────────────────────── */
.eyebrow {
  font: 600 12px/1 'Archivo', sans-serif;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--grey-500);
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow::before {
  content: ""; width: 18px; height: 2px; background: var(--wine);
}
.h-display {
  font-family: 'Archivo Black', 'Archivo', sans-serif;
  font-weight: 900;
  letter-spacing: -0.025em;
  line-height: 0.92;
  margin: 0;
  color: var(--ink);
}
.h-section {
  font-family: 'Archivo Black', sans-serif;
  font-weight: 900;
  font-size: clamp(36px, 5vw, 64px);
  letter-spacing: -0.02em;
  line-height: 0.95;
  margin: 0 0 16px;
  color: var(--ink);
}
.lead {
  font: 400 17px/1.55 'Archivo', sans-serif;
  color: var(--grey-500);
  max-width: 56ch;
}

/* ── Nav ────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--grey-200);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 76px;
}
.brand {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Archivo Black', sans-serif;
  font-size: 22px; letter-spacing: -0.01em; line-height: 1;
}
.brand img { width: 38px; height: auto; margin-top: -3px; flex-shrink: 0; }
.brand .b-dtd { color: var(--wine); }
.brand .b-cargo { color: var(--ink); margin-left: 2px; }
.nav-links {
  display: flex; align-items: center; gap: 12px;
}
.nav-links a {
  font: 500 14px/1 'Archivo', sans-serif;
  color: var(--ink);
  position: relative;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--white);
  box-shadow: var(--card-shadow);
  transition: color .15s, background .15s, transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s;
}
.nav-links a:hover {
  color: var(--wine);
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
}
/* CTA en el nav: texto blanco, padding cómodo, sombra y hover propios */
.nav-links a.btn,
.nav-links a.btn-primary {
  color: var(--white) !important;
  padding: 0 24px !important;
  font-size: 13.5px !important;
  letter-spacing: 0.02em;
  height: 44px !important;
  background: var(--wine);
  box-shadow: var(--card-shadow);
}
.nav-links a.btn-primary:hover {
  color: var(--white) !important;
  background: var(--wine-deep);
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
}
.nav-links a.has-caret::after {
  content: "▾"; font-size: 9px; margin-left: 6px; color: var(--grey-500);
}

/* ── Buttons ────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 22px;
  border-radius: 8px;
  font: 600 14.5px/1 'Archivo', sans-serif;
  letter-spacing: 0.01em;
  transition: transform .12s, background .15s, color .15s, box-shadow .15s;
}
.btn-primary {
  background: var(--wine); color: var(--white);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -8px rgba(127,15,26,0.45);
}
.btn-primary:hover { background: var(--wine-deep); transform: translateY(-1px); }
.btn-ghost {
  background: transparent; color: var(--ink);
  border: 1.5px solid var(--grey-300);
}
.btn-ghost:hover { border-color: var(--ink); }
.btn-dark { background: var(--ink); color: var(--white); }
.btn-dark:hover { background: var(--grey-700); }

/* ── Hero ───────────────────────────────────────────────────── */
.hero {
  position: relative;
  padding: 60px 0 80px;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 40px;
  align-items: center;
}
.hero-display {
  font-size: clamp(48px, 7.2vw, 112px);
}
.hero-display .w { display: block; }
.hero-display .word-mark {
  color: var(--wine);
}
.hero-display .word-grey {
  color: var(--grey-700);
}
.hero-sub {
  margin: 24px 0 32px;
  font: 400 17px/1.55 'Archivo', sans-serif;
  color: var(--grey-500);
  max-width: 48ch;
}
.search {
  background: var(--white);
  border: 1px solid var(--grey-200);
  border-radius: 14px;
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  box-shadow: 0 30px 60px -30px rgba(20,20,20,0.18);
  max-width: 620px;
}
.search-field {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--grey-100);
  height: 56px;
}
.search-field svg { flex: 0 0 18px; color: var(--grey-500); }
.search-field input {
  flex: 1; border: 0; outline: 0; background: transparent;
  font: 500 14.5px/1 'Archivo', sans-serif;
  color: var(--ink);
}
.search-field input::placeholder { color: var(--grey-500); font-weight: 400; }
.search .btn { height: 56px; }

.hero-illus { position: relative; min-height: 480px; }
.hero-illus .container-img {
  position: absolute; right: -60px; top: 0;
  width: 720px; max-width: 110%;
  transform: rotate(-3deg);
}
.badge-360 {
  position: absolute; left: 6%; top: 8%;
  width: 78px; height: 78px;
  border-radius: 50%;
  background: var(--wine);
  color: var(--white);
  display: grid; place-items: center;
  font: 800 16px/1 'Archivo Black', sans-serif;
  box-shadow: 0 14px 30px -10px rgba(127,15,26,0.55);
  z-index: 2;
}
.badge-360 small { display: block; font: 500 9px/1 'Archivo', sans-serif; letter-spacing: 0.1em; margin-top: 6px; opacity: 0.85; }
.trajectory { position: absolute; inset: 0; pointer-events: none; }

/* ── Marquee / trust bar ────────────────────────────────────── */
.marquee {
  border-top: 1px solid var(--grey-200);
  border-bottom: 1px solid var(--grey-200);
  padding: 22px 0;
  background: var(--paper);
  overflow: hidden;
}
.marquee-track {
  display: flex; gap: 56px; align-items: center;
  font: 700 16px/1 'Archivo', sans-serif;
  color: var(--grey-500);
  letter-spacing: 0.06em;
  white-space: nowrap;
  animation: scroll 36s linear infinite;
}
.marquee-track span { display: inline-flex; align-items: center; gap: 14px; }
.marquee-track span::after {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--wine); margin-left: 56px;
}
@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ── Stats ──────────────────────────────────────────────────── */
.stats {
  padding: 80px 0;
  background: var(--ink);
  color: var(--white);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 28px;
}
.stat-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(48px, 6vw, 88px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--white);
}
.stat-num .accent { color: var(--wine-soft); }
.stat-label {
  margin-top: 12px;
  font: 500 13.5px/1.4 'Archivo', sans-serif;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ── Sections ───────────────────────────────────────────────── */
.section { padding: 100px 0; }
.section-paper { background: var(--paper); }

.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 40px; margin-bottom: 56px;
}
.section-head .lead { max-width: 36ch; }

/* ── Services ───────────────────────────────────────────────── */
.services-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
.services-grid.services-grid-5 {
  grid-template-columns: repeat(5, 1fr);
}
@media (max-width: 1200px) {
  .services-grid.services-grid-5 { grid-template-columns: repeat(3, 1fr); }
}
.service-card {
  border: 1px solid var(--grey-200);
  background: var(--white);
  border-radius: 18px;
  padding: 28px;
  display: flex; flex-direction: column;
  min-height: 320px;
  transition: border-color .15s, transform .15s, box-shadow .2s;
}
.service-card:hover {
  border-color: var(--ink);
  transform: translateY(-4px);
  box-shadow: 0 30px 50px -30px rgba(20,20,20,0.25);
}
.service-card.dark {
  background: var(--ink); color: var(--white); border-color: var(--ink);
}
.service-card.dark:hover { background: var(--wine); border-color: var(--wine); }
.service-icon {
  width: 56px; height: 56px;
  border-radius: 12px;
  background: var(--grey-100);
  display: grid; place-items: center;
  margin-bottom: 24px;
  color: var(--ink);
}
.service-card.dark .service-icon { background: rgba(255,255,255,0.08); color: var(--white); }
.service-title {
  font: 800 22px/1.1 'Archivo', sans-serif;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.service-copy {
  font: 400 14.5px/1.5 'Archivo', sans-serif;
  color: var(--grey-500);
  flex: 1;
}
.service-card.dark .service-copy { color: rgba(255,255,255,0.7); }
.service-cta {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 13.5px/1 'Archivo', sans-serif;
  margin-top: 16px;
}
.service-cta .arrow { transition: transform .2s; }
.service-card:hover .service-cta .arrow { transform: translateX(4px); }

/* ── How we work ────────────────────────────────────────────── */
.steps {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border-top: 1px solid var(--grey-200);
}
.step {
  padding: 36px 28px 36px 0;
  border-right: 1px solid var(--grey-200);
  position: relative;
}
.step:last-child { border-right: 0; }
.step-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px; color: var(--wine);
  letter-spacing: 0.1em;
}
.step-title {
  margin: 12px 0 8px;
  font: 800 24px/1.1 'Archivo', sans-serif;
  letter-spacing: -0.01em;
}
.step-copy {
  font: 400 14px/1.55 'Archivo', sans-serif;
  color: var(--grey-500);
  max-width: 28ch;
}

/* ── Tracking ───────────────────────────────────────────────── */
.track-card {
  background: var(--ink); color: var(--white);
  border-radius: 24px;
  padding: 56px;
  display: grid; grid-template-columns: 1fr 1.05fr; gap: 48px;
  align-items: center;
}
.track-input {
  display: flex; gap: 0;
  background: var(--white);
  border-radius: 12px;
  overflow: hidden;
  margin-top: 20px;
}
.track-input input {
  flex: 1; border: 0; outline: 0; background: transparent;
  padding: 0 20px; height: 56px;
  font: 600 16px/1 'Archivo', sans-serif;
  letter-spacing: 0.04em;
  color: var(--ink);
}
.track-input input::placeholder { color: var(--grey-500); }
.track-input button { border-radius: 0; height: 56px; }

.timeline { display: flex; flex-direction: column; gap: 22px; }
.tl-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 16px; align-items: center; }
.tl-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--grey-700); border: 2px solid var(--grey-700);
}
.tl-dot.done { background: var(--wine); border-color: var(--wine); }
.tl-dot.active { background: var(--wine); border-color: var(--white); box-shadow: 0 0 0 4px rgba(127,15,26,0.4); }
.tl-step { font: 500 14.5px/1.3 'Archivo', sans-serif; color: var(--white); }
.tl-meta { font: 400 12.5px/1.3 'Archivo', sans-serif; color: rgba(255,255,255,0.5); margin-top: 2px; }
.tl-time { font: 600 12px/1 'Archivo', sans-serif; color: rgba(255,255,255,0.4); letter-spacing: 0.06em; }
.tl-line { grid-column: 1; justify-self: center; width: 2px; background: var(--grey-700); height: 100%; }

/* ── Brand board ────────────────────────────────────────────── */
.brand-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 16px;
}
.brand-grid > * {
  background: var(--white); border: 1px solid var(--grey-200);
  border-radius: 18px; padding: 32px;
}
.card-lockup { background: var(--paper); display: grid; place-items: center; min-height: 320px; }
.card-lockup-dark { background: var(--ink); color: var(--white); display: grid; place-items: center; min-height: 320px; border-color: var(--ink); }
.card-lockup img, .card-lockup-dark img { width: 64%; }
.swatch-card {
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 200px; padding: 24px; color: var(--white);
}
.swatch-card.dark { color: var(--white); }
.swatch-card.light { color: var(--ink); }
.sw-name { font: 700 13px/1 'Archivo', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
.sw-hex { font: 800 18px/1 'Archivo Black', sans-serif; letter-spacing: -0.01em; }
.type-spec { padding: 32px; min-height: 260px; }
.type-spec .label { font: 600 11.5px/1 'Archivo', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey-500); margin-bottom: 14px; }
.type-spec .display-sample { font-family: 'Archivo Black', sans-serif; font-size: 72px; line-height: 0.9; letter-spacing: -0.03em; color: var(--ink); }
.type-spec .body-sample { font: 400 18px/1.5 'Archivo', sans-serif; color: var(--grey-500); margin-top: 20px; max-width: 32ch; }
.type-weights { display: flex; gap: 18px; margin-top: 18px; font-family: 'Archivo', sans-serif; color: var(--grey-700); }
.type-weights span { font-size: 18px; }

.container-app {
  grid-column: span 3;
  background: var(--ink);
  border-radius: 18px;
  padding: 0;
  overflow: hidden;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 0;
  min-height: 380px;
  border: 0;
}
.container-app-copy { padding: 48px; color: var(--white); align-self: center; }
.container-app-copy .eyebrow { color: rgba(255,255,255,0.5); }
.container-app-copy .eyebrow::before { background: var(--wine-soft); }
.container-app-copy h3 {
  font: 900 36px/1 'Archivo Black', sans-serif; letter-spacing: -0.02em;
  margin: 18px 0 12px; color: var(--white);
}
.container-app-copy p { font: 400 15px/1.55 'Archivo', sans-serif; color: rgba(255,255,255,0.7); margin: 0; max-width: 36ch; }
.container-app-art {
  position: relative;
  display: grid; place-items: center;
  padding: 40px 20px;
}

/* ── Brand book navigator (sidebar + ⌘K palette) ────────────── */
.bb-handle {
  position: fixed; top: 50%; left: 0; transform: translateY(-50%);
  z-index: 200;
  width: 40px; padding: 18px 0;
  background: var(--ink); color: var(--white);
  border-radius: 0 10px 10px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: 0 14px 30px -10px rgba(15,30,61,0.4);
  transition: transform .18s cubic-bezier(.2,.7,.3,1), background .15s;
}
.bb-handle:hover { transform: translateY(-50%) translateX(2px); background: var(--wine); }
.bb-handle .bb-handle-label {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font: 700 11px/1 'Archivo', sans-serif; letter-spacing: 0.22em; text-transform: uppercase;
}
.bb-handle .bb-handle-icon { width: 14px; height: 14px; }

.bb-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 340px; z-index: 210;
  background: var(--ink); color: var(--white);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow: 24px 0 60px -20px rgba(0,0,0,0.4);
}
.bb-sidebar.open { transform: translateX(0); }
.bb-sidebar-head {
  padding: 24px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.bb-sidebar-title {
  font: 900 18px/1.1 'Archivo Black', sans-serif; letter-spacing: -0.01em; color: var(--white);
}
.bb-sidebar-title .accent { color: var(--wine-soft); }
.bb-sidebar-sub {
  margin-top: 4px;
  font: 500 11px/1.2 'Archivo', sans-serif; color: rgba(255,255,255,0.5);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.bb-sidebar-close {
  width: 30px; height: 30px;
  background: rgba(255,255,255,0.08); border-radius: 6px;
  color: var(--white); display: grid; place-items: center; cursor: pointer;
  transition: background .15s;
}
.bb-sidebar-close:hover { background: var(--wine); }

.bb-sidebar-search {
  margin: 16px 24px 4px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.06); border-radius: 8px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background .15s;
  font: 500 13px/1 'Archivo', sans-serif; color: rgba(255,255,255,0.55);
}
.bb-sidebar-search:hover { background: rgba(255,255,255,0.1); }
.bb-sidebar-search kbd {
  margin-left: auto;
  font: 700 10px/1 ui-monospace, monospace;
  padding: 4px 6px; background: rgba(255,255,255,0.1); border-radius: 4px;
  color: rgba(255,255,255,0.7); letter-spacing: 0.06em;
}

.bb-sidebar-list { flex: 1; overflow-y: auto; padding: 16px 12px 24px; }
.bb-sidebar-list::-webkit-scrollbar { width: 6px; }
.bb-sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.bb-group-label {
  padding: 14px 14px 8px;
  font: 700 10px/1 'Archivo', sans-serif; color: rgba(255,255,255,0.4);
  letter-spacing: 0.18em; text-transform: uppercase;
}
.bb-item {
  display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center;
  padding: 10px 14px; border-radius: 8px;
  cursor: pointer; color: rgba(255,255,255,0.92);
  transition: background .15s, color .15s;
  position: relative;
}
.bb-item:hover { background: rgba(255,255,255,0.06); }
.bb-item.active { background: rgba(127,15,26,0.18); color: var(--white); }
.bb-item.active::before {
  content:''; position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 3px; background: var(--wine-soft); border-radius: 2px;
}
.bb-item-num {
  font: 800 11px/1 'Archivo Black', sans-serif;
  letter-spacing: 0.04em;
  color: var(--wine-soft);
  padding: 5px 7px; background: rgba(194,116,127,0.12); border-radius: 5px;
  text-align: center;
}
.bb-item.active .bb-item-num { background: var(--wine); color: var(--white); }
.bb-item-title { font: 700 13.5px/1.2 'Archivo', sans-serif; letter-spacing: -0.01em; }
.bb-item-sub  { font: 400 11.5px/1.35 'Archivo', sans-serif; color: rgba(255,255,255,0.55); margin-top: 2px; }

.bb-sidebar-foot {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 14px 24px;
  font: 500 11px/1.4 'Archivo', sans-serif; color: rgba(255,255,255,0.45);
  letter-spacing: 0.06em;
}

.bb-backdrop {
  position: fixed; inset: 0; z-index: 205;
  background: rgba(15,30,61,0.45); backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.bb-backdrop.show { opacity: 1; pointer-events: auto; }

/* Command palette */
.bb-palette-bg {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(15,30,61,0.55); backdrop-filter: blur(6px);
  display: grid; place-items: flex-start center;
  padding-top: 12vh;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.bb-palette-bg.show { opacity: 1; pointer-events: auto; }
.bb-palette {
  width: 92%; max-width: 600px;
  background: var(--white); border-radius: 14px;
  box-shadow: 0 40px 80px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(15,30,61,0.06);
  overflow: hidden;
  transform: translateY(-8px) scale(0.98);
  transition: transform .22s cubic-bezier(.2,.7,.3,1);
}
.bb-palette-bg.show .bb-palette { transform: translateY(0) scale(1); }

.bb-palette-search {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--grey-200);
}
.bb-palette-search svg { color: var(--grey-500); flex: 0 0 18px; }
.bb-palette-input {
  flex: 1; border: 0; outline: 0; background: transparent;
  font: 500 17px/1 'Archivo', sans-serif; color: var(--ink);
}
.bb-palette-input::placeholder { color: var(--grey-500); font-weight: 400; }
.bb-palette-kbd {
  font: 700 10.5px/1 ui-monospace, monospace;
  padding: 4px 6px; background: var(--grey-100); border-radius: 4px;
  color: var(--grey-500); letter-spacing: 0.06em;
}

.bb-palette-results {
  max-height: 52vh; overflow-y: auto;
  padding: 8px;
}
.bb-palette-results::-webkit-scrollbar { width: 6px; }
.bb-palette-results::-webkit-scrollbar-thumb { background: var(--grey-300); border-radius: 3px; }

.bb-result {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 14px; border-radius: 8px; cursor: pointer;
}
.bb-result.focused { background: var(--paper); }
.bb-result-num {
  text-align: center;
  font: 800 12px/1 'Archivo Black', sans-serif;
  letter-spacing: 0.04em; color: var(--wine);
  padding: 6px 4px; background: rgba(127,15,26,0.08); border-radius: 6px;
}
.bb-result-title { font: 700 14.5px/1.2 'Archivo', sans-serif; color: var(--ink); }
.bb-result-sub   { font: 400 12.5px/1.4 'Archivo', sans-serif; color: var(--grey-500); margin-top: 2px; }
.bb-result-title mark { background: rgba(127,15,26,0.18); color: var(--wine); padding: 0 2px; border-radius: 3px; }
.bb-result-sub mark   { background: rgba(127,15,26,0.18); color: var(--wine); padding: 0 2px; border-radius: 3px; }
.bb-result-go {
  font: 600 11px/1 'Archivo', sans-serif; color: var(--grey-500); letter-spacing: 0.06em;
  padding: 5px 8px; background: var(--grey-100); border-radius: 4px;
}
.bb-result.focused .bb-result-go { background: var(--wine); color: var(--white); }

.bb-palette-empty {
  padding: 36px 22px; text-align: center;
  font: 500 14px/1.5 'Archivo', sans-serif; color: var(--grey-500);
}

.bb-palette-foot {
  padding: 10px 18px; border-top: 1px solid var(--grey-200);
  display: flex; justify-content: space-between; align-items: center;
  font: 500 11.5px/1 'Archivo', sans-serif; color: var(--grey-500);
}
.bb-palette-foot .bb-shortcuts { display: flex; gap: 16px; }
.bb-palette-foot kbd {
  font: 700 10px/1 ui-monospace, monospace;
  padding: 3px 5px; background: var(--grey-100); border-radius: 3px;
  color: var(--grey-500); margin-right: 6px;
}

/* ── Card shadows (v1.1 · separación visual) ────────────────── */
/* Sombra sutil para todas las "ventanas" / cards de las páginas
   del brand book, así no se leen como bloque corrido.
   Nota: React renderiza inline styles como `border-radius: 14px`
   (kebab-case + unidad), no como `borderRadius: 14`. */
/* ── Card shadows (v1.1 · separación visual) ────────────────── */
/* Sombra ESTÁNDAR aplicada a todas las "ventanas" / cards del brand
   book. Cualquier elemento con clase de card O con border-radius
   14/18/24 px inline. Una sola fuente: --card-shadow. */
.section [style*="border-radius: 14px"],
.section [style*="border-radius: 18px"],
.section [style*="border-radius: 24px"],
.service-card,
.brand-grid > *,
.track-card,
.swatch-card,
.card-lockup,
.card-lockup-dark,
.type-spec,
.container-app,
.stats-grid > div,
.steps > .step,
.flow-step,
.search,
.bb-palette,
.lt-panel,
.bb-sidebar,
.service-icon ~ * .service-card,
[class*="-card"]:not(.bb-result):not(.bb-item) {
  box-shadow: var(--card-shadow) !important;
  transition: box-shadow .25s cubic-bezier(.2,.7,.3,1), transform .2s !important;
}
.section [style*="border-radius: 14px"]:hover,
.section [style*="border-radius: 18px"]:hover,
.section [style*="border-radius: 24px"]:hover,
.service-card:hover,
.brand-grid > *:hover,
.track-card:hover,
.swatch-card:hover,
.flow-step:hover,
[class*="-card"]:not(.bb-result):not(.bb-item):hover {
  box-shadow: var(--card-shadow-hover) !important;
  transform: translateY(-2px);
}
/* Elementos chicos NO heredan sombra (chips, dots, badges, inputs) */
.section [style*="border-radius: 4px"],
.section [style*="border-radius: 5px"],
.section [style*="border-radius: 6px"],
.section [style*="border-radius: 8px"],
.section [style*="border-radius: 10px"],
.section [style*="border-radius: 12px"],
.section [style*="border-radius: 99px"],
.section [style*="border-radius: 999px"] {
  box-shadow: none !important;
  transform: none !important;
}
.steps > .step {
  background: var(--white);
  border-radius: 14px;
  padding-left: 24px;
  padding-right: 24px;
  border-right: 0 !important;
  margin-right: 0;
}
.stats-grid > div {
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  padding: 24px;
}
/* No aplicar a hijos pequeños (icon wrappers, dots, chips) */
.section [style*="border-radius: 4px"],
.section [style*="border-radius: 6px"],
.section [style*="border-radius: 8px"],
.section [style*="border-radius: 10px"] {
  box-shadow: none !important;
}

/* ── Footer ─────────────────────────────────────────────────── */
/* ── How we work · flow horizontal con flechas ───────────────── */
.flow-steps {
  display: grid;
  grid-template-columns: 1fr 36px 1fr 36px 1fr 36px 1fr;
  gap: 16px;
  align-items: stretch;
}
.flow-step {
  background: var(--white);
  border: 1px solid var(--grey-200);
  border-radius: 14px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  transition: transform .2s cubic-bezier(.2,.7,.3,1), border-color .15s;
}
.flow-step:hover {
  transform: translateY(-3px);
  border-color: var(--wine);
}
.flow-step-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: rgba(127,15,26,0.08);
  color: var(--wine);
  display: grid; place-items: center;
  margin-bottom: 4px;
  transition: background .2s, color .2s;
}
.flow-step:hover .flow-step-icon {
  background: var(--wine);
  color: var(--white);
}
.flow-step-num {
  font: 800 12px/1 'Archivo Black', sans-serif;
  color: var(--wine);
  letter-spacing: 0.08em;
}
.flow-step-title {
  font: 800 22px/1.1 'Archivo', sans-serif;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.flow-step-copy {
  font: 400 13.5px/1.5 'Archivo', sans-serif;
  color: var(--grey-500);
  flex: 1;
}
.flow-arrow {
  display: grid; place-items: center;
  color: var(--wine);
  opacity: 0.55;
  align-self: center;
}
.flow-arrow svg { width: 32px; height: 12px; }
@media (max-width: 1080px) {
  .flow-steps { grid-template-columns: 1fr 36px 1fr; }
  .flow-arrow:nth-of-type(4) { display: none; }
}
@media (max-width: 720px) {
  .flow-steps { grid-template-columns: 1fr; }
  .flow-arrow { transform: rotate(90deg); padding: 4px 0; }
}

.foot {
  background: var(--ink); color: var(--white);
  padding: 80px 0 32px;
}
.foot-brand-row {
  padding-bottom: 28px;
  margin-bottom: 28px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.foot-grid {
  display: grid;
  grid-template-columns: 0.75fr 0.75fr 1.1fr 1.5fr;
  gap: 14px;
  align-items: start;
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.foot-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 0;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 8px 20px rgba(0,0,0,0.32),
    0 24px 60px -20px rgba(0,0,0,0.5);
  transition: background .18s, border-color .18s, transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s;
}
.foot-card h4 { font-size: 10px; margin: 0 0 10px; letter-spacing: 0.14em; }
.foot-card ul { gap: 6px; }
.foot-card a, .foot-card li, .foot-card span { font-size: 11.5px !important; line-height: 1.4; word-break: break-word; }
.foot-card:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.06) inset,
    0 12px 28px rgba(0,0,0,0.4),
    0 36px 80px -20px rgba(0,0,0,0.6);
}
.foot h4 { font: 700 12.5px/1 'Archivo', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 0 0 18px; }
.foot ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.foot a { font: 500 14.5px/1 'Archivo', sans-serif; color: rgba(255,255,255,0.85); }
.foot a:hover { color: var(--wine-soft); }
.foot-brand .brand { font-size: 28px; margin-bottom: 18px; }
.foot-brand .brand .b-dtd { color: var(--wine-soft); }
.foot-brand .brand .b-cargo { color: rgba(255,255,255,0.85); }
.foot-brand p { font: 400 14.5px/1.5 'Archivo', sans-serif; color: rgba(255,255,255,0.6); max-width: 36ch; }
.foot-bottom {
  padding-top: 28px;
  display: flex; justify-content: space-between; align-items: center;
  font: 500 12.5px/1 'Archivo', sans-serif; color: rgba(255,255,255,0.45);
  letter-spacing: 0.06em;
}

/* ── Responsive trims ───────────────────────────────────────── */
@media (max-width: 1080px) {
  .services-grid { grid-template-columns: repeat(2, 1fr); }
  .steps { grid-template-columns: repeat(2, 1fr); }
  .steps .step:nth-child(2) { border-right: 0; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-grid { grid-template-columns: 1fr; }
  .hero-illus { min-height: 320px; }
  .hero-illus .container-img { position: relative; right: 0; width: 100%; }
  .track-card { grid-template-columns: 1fr; padding: 32px; }
  .brand-grid { grid-template-columns: 1fr 1fr; }
  .container-app { grid-column: span 2; grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 0.75fr 0.75fr 1.1fr 1.5fr; gap: 14px; }
  .foot-brand { max-width: 720px; }
}
@media (max-width: 720px) {
  .nav-links a:not(.btn) { display: none; }
  .services-grid, .steps, .stats-grid, .brand-grid { grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 1fr 1fr; }
  .container-app { grid-column: 1; }
  .search { grid-template-columns: 1fr; }
  .section { padding: 64px 0; }
}

</style>
</head>

/* ── shared chrome ──────────────────────────────────────────── */
function BrandSection({ id, eyebrow, title, lead, children, dark = false }) {
  // Look up page number from the central PAGES index (defined later in the file).
  // typeof check guards against the order of declaration during initial parse.
  const idx = typeof PAGES !== 'undefined' ? PAGES.findIndex((p) => p.id === id) : -1;
  const total = typeof PAGES !== 'undefined' ? PAGES.length : 0;
  const pageNum = idx >= 0 ? String(idx + 1).padStart(2, '0') : null;
  const pageTotal = String(total).padStart(2, '0');

  return (
    <section className={`section${dark ? '' : ' section-paper'}`} id={id}
    style={dark ? { background: 'var(--ink)', color: 'var(--white)', position: 'relative' } : { position: 'relative' }}>
      {pageNum &&
      <div style={{
        position: 'absolute', top: 24, right: 28, zIndex: 2,
        padding: '5px 10px',
        background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(15,30,61,0.05)',
        border: `1px solid ${dark ? 'rgba(255,255,255,0.12)' : 'rgba(15,30,61,0.1)'}`,
        borderRadius: 6,
        font: '700 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace',
        letterSpacing: '0.08em',
        color: dark ? 'rgba(255,255,255,0.6)' : 'var(--grey-500)'
      }}>
          PÁG <span style={{ color: dark ? 'var(--wine-soft)' : 'var(--wine)' }}>{pageNum}</span> / {pageTotal}
        </div>
      }
      <div className="wrap">
        <div className="section-head">
          <div>
            <span className="eyebrow" style={dark ? { color: 'rgba(255,255,255,0.55)' } : null}>{eyebrow}</span>
            <h2 className="h-section" style={{ marginTop: 16, color: dark ? 'var(--white)' : 'var(--ink)' }}
            dangerouslySetInnerHTML={{ __html: title }} />
          </div>
          <p className="lead" style={dark ? { color: 'rgba(255,255,255,0.7)' } : null}>{lead}</p>
        </div>
        {children}
      </div>
    </section>);

}

function BrandCorridor() {
  const origins = [
  { id: 'YIW', x: 798, y: 268, name: 'Yiwu 义乌', sub: 'Ferias y mayoristas', labelAt: 'right' },
  { id: 'CAN', x: 770, y: 306, name: 'Guangzhou 广州', sub: 'Textiles y electrónica', labelAt: 'left' },
  { id: 'SZX', x: 786, y: 316, name: 'Shenzhen 深圳', sub: 'Hub tecnología', labelAt: 'right' }];

  // Puertos venezolanos · ubicación + dirección de etiqueta para que NO se crucen
  const ports = [
  { id: 'MAR', x: 168, y: 256, name: 'Maracaibo', sub: 'Zulia · Caribe occidental', labelAt: 'left' },
  { id: 'PFJ', x: 222, y: 215, name: 'Punto Fijo', sub: 'Paraguaná · Falcón', labelAt: 'above' },
  { id: 'PCB', x: 280, y: 247, name: 'Puerto Cabello', sub: 'Carabobo · puerto principal', labelAt: 'below' },
  { id: 'CCS', x: 330, y: 252, name: 'Caracas', sub: 'La Guaira · capital', labelAt: 'right' }];


  // Routes from each origin to each port
  const routes = [];
  for (const o of origins) for (const p of ports) {
    const mx = (o.x + p.x) / 2;
    const my = Math.min(o.y, p.y) - 95;
    routes.push(`M ${o.x} ${o.y} Q ${mx} ${my} ${p.x} ${p.y}`);
  }
  const routesPaths = routes.map((d) => `<path d="${d}"/>`).join('');

  // Helper: rendering label at the right offset
  const Label = ({ node }) => {
    let tx = 22,ty = -4,anchor = 'start';
    let txSub = 22,tySub = 11;
    if (node.labelAt === 'left') {tx = -18;ty = -4;anchor = 'end';txSub = -18;tySub = 11;}
    if (node.labelAt === 'right') {tx = 22;ty = -4;anchor = 'start';txSub = 22;tySub = 11;}
    if (node.labelAt === 'above') {tx = 0;ty = -22;anchor = 'middle';txSub = 0;tySub = -9;}
    if (node.labelAt === 'below') {tx = 0;ty = 24;anchor = 'middle';txSub = 0;tySub = 36;}
    return (
      <>
        <text x={tx} y={ty} fontFamily="Archivo Black, sans-serif" fontSize="13" fill="#0F1E3D" textAnchor={anchor} letterSpacing="-0.3">{node.name}</text>
        <text x={txSub} y={tySub} fontFamily="Archivo, sans-serif" fontSize="10" fill="rgba(15,30,61,0.6)" textAnchor={anchor} fontWeight="500">{node.sub}</text>
      </>);

  };

  return (
    <BrandSection
      id="brand-corridor"

function PageNav() {
  const isMac = typeof navigator !== 'undefined' &&
  /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const shortcutLabel = isMac ? '⌘ K' : 'Ctrl K';
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const [focused, setFocused] = React.useState(0);
  const [activeId, setActiveId] = React.useState('top');
  const inputRef = React.useRef(null);

  // Track active section while scrolling
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries.
        filter((e) => e.isIntersecting).
        sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) setActiveId(visible[0].target.id);
      },
      { rootMargin: '-30% 0px -60% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] }
    );
    PAGES.forEach((p) => {
      const el = document.getElementById(p.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  // ⌘K listener
  React.useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setPaletteOpen((o) => !o);
      }
      if (e.key === 'Escape') {
        setPaletteOpen(false);
        setSidebarOpen(false);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  // Focus input when palette opens
  React.useEffect(() => {
    if (paletteOpen) {
      setTimeout(() => inputRef.current?.focus(), 60);
      setQuery('');
      setFocused(0);
    }
  }, [paletteOpen]);

  // Fuzzy filter helper
  const normalize = (s) => s.toLowerCase().
  normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const results = React.useMemo(() => {
    const q = normalize(query.trim());
    if (!q) return PAGES;
    return PAGES.map((p) => {
      const hay = normalize([p.title, p.subtitle, p.group, ...p.keywords].join(' '));
      const idx = hay.indexOf(q);
      let score = -1;
      if (normalize(p.title).startsWith(q)) score = 100;else
      if (normalize(p.title).includes(q)) score = 80;else
      if (p.keywords.some((k) => normalize(k).startsWith(q))) score = 70;else
      if (idx >= 0) score = 50 - idx * 0.1;
      return { p, score };
    }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).map((x) => x.p);
  }, [query]);

  const go = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 60;
      window.scrollTo({ top, behavior: 'smooth' });
    }
    setPaletteOpen(false);
    setSidebarOpen(false);
  };

  // Highlight matched substring
  const Highlight = ({ text }) => {
    const q = query.trim();
    if (!q) return <>{text}</>;
    const i = normalize(text).indexOf(normalize(q));
    if (i < 0) return <>{text}</>;
    return <>{text.slice(0, i)}<mark>{text.slice(i, i + q.length)}</mark>{text.slice(i + q.length)}</>;
  };

  const onKeyDown = (e) => {
    if (e.key === 'ArrowDown') {e.preventDefault();setFocused((f) => Math.min(f + 1, results.length - 1));}
    if (e.key === 'ArrowUp') {e.preventDefault();setFocused((f) => Math.max(f - 1, 0));}
    if (e.key === 'Enter') {e.preventDefault();if (results[focused]) go(results[focused].id);}
  };

  // Group sidebar items by their group
  const groups = PAGES.reduce((acc, p) => {
    acc[p.group] = acc[p.group] || [];

}

/* ── PageIndicator (right edge "08 / 14") ───────────────────── */
function PageIndicator() {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const [dark, setDark] = React.useState(false);

  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries.
        filter((e) => e.isIntersecting).
        sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) {
          const id = visible[0].target.id;
          const idx = PAGES.findIndex((p) => p.id === id);
          if (idx >= 0) setActiveIdx(idx);
          // Tint the indicator when over a dark section
          const bg = getComputedStyle(visible[0].target).backgroundColor;
          // Simple heuristic: if the section uses --ink the bg parses to rgb(15, 30, 61)
          setDark(/rgb\(15,\s*30,\s*61/.test(bg) || /rgb\(22,\s*22,\s*22/.test(bg));
        }
      },
      { rootMargin: '-30% 0px -60% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] }
    );
    PAGES.forEach((p) => {
      const el = document.getElementById(p.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  const total = PAGES.length;
  const current = activeIdx + 1;
  const page = PAGES[activeIdx];
  const progress = Math.round(current / total * 100);

  const jumpToSidebar = () => {
    // Forward a synthetic key event so PageNav opens the palette/sidebar
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', metaKey: true, ctrlKey: true, bubbles: true }));
  };

  return (
    <div className={`pi-card ${dark ? 'dark' : ''}`} onClick={jumpToSidebar} title="Abrir buscador">
      <div className="pi-numwrap">
        <span className="pi-num">{String(current).padStart(2, '0')}</span>
        <span className="pi-total">/ {String(total).padStart(2, '0')}</span>
      </div>
      <div className="pi-label">{page?.title}</div>
      <div className="pi-bar"><div className="pi-bar-fill" style={{ width: `${progress}%` }} /></div>
    </div>);

}

function PageNumberBadge() {
  const [info, setInfo] = React.useState({ num: '00', total: '27', title: 'Sitio web' });
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      entries => {
        const visible = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) {
          const id = visible[0].target.id;
          const page = PAGES.find(p => p.id === id);
          if (page) setInfo({ num: page.num, total: String(PAGES.length - 1).padStart(2, '0'), title: page.title });
        }
      },
      { rootMargin: '-40% 0px -50% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] }
    );
    PAGES.forEach(p => {
      const el = document.getElementById(p.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);
  return (
    <div style={{
      position:'fixed', bottom: 14, left: '50%', transform:'translateX(-50%)',
      zIndex: 175,

    documento: '', whatsapp: '', email: '',
    direccion: ''
  });
  const [docs, setDocs] = React.useState([]);
  const [markbox, setMarkbox] = React.useState(null);
  const [hover, setHover] = React.useState(null);

  const set = (k) => (e) => setF((v) => ({ ...v, [k]: e.target.value }));
  const addDoc = (e) => {
    const files = Array.from(e.target.files || []);
    setDocs((d) => [...d, ...files.map((file) => ({ name: file.name, size: file.size }))]);
    e.target.value = '';
