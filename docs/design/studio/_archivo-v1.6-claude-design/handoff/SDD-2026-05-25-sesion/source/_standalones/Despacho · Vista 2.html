<!doctype html>
<html lang="es" data-theme="dark" data-density="compact">
<head>
<meta charset="utf-8" />
<title>DTD ERP · Despacho · Vista 2 (Reglas)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="erp/tokens.css" />
<style>
  .preview-wrap { min-height: 100vh; background: var(--bg-base); padding: var(--s-8); }
  .preview-inner { max-width: 1440px; margin: 0 auto; }
  @keyframes erp-pop { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes erp-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes erp-fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="erp/icons.jsx"></script>
<script type="text/babel" src="erp/data-bridge.jsx"></script>
<script type="text/babel" src="erp/components.jsx"></script>
<script type="text/babel" src="erp/modules/despacho-rules.jsx"></script>

<script type="text/babel">
  function App() {
    function goTo(mod) {
      if (mod === 'admin' || mod === 'admin-routes') {
        window.location.href = 'Admin · Rutas.html';
      } else if (mod === 'despacho') {
        window.location.href = 'Despacho · Vista 1.html';
      } else if (mod === 'clients') {
        alert('Navegaría al módulo Clientes — no disponible en este preview standalone.');
      } else {
        console.log('goTo →', mod);
      }
    }
    return (
      <div className="preview-wrap" data-screen-label="02 Despacho · Reglas">
        <div className="preview-inner">
          <window.ModuleDespachoRules goTo={goTo} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
