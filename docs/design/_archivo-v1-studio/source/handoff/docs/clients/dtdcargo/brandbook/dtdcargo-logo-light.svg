<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 380" preserveAspectRatio="xMidYMid meet">
  <title>DTD-Cargo · lockup light (para fondos oscuros)</title>
  <defs>
    <filter id="lighten" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.91   0 0 0 0 0.86   0 0 0 1 0"></feColorMatrix>
    </filter>
  </defs>
  <rect width="1500" height="380" fill="#0F1E3D"></rect>
  <image xlink:href="dtdcargo-isotipo.png" href="dtdcargo-isotipo.png" x="20" y="20" width="340" height="340" filter="url(#lighten)"></image>
  <g font-family="Archivo Black, Arial Black, Impact, sans-serif" font-weight="900" font-size="190" letter-spacing="-4">
    <text x="410" y="260" fill="#C2747F">DTD</text>
    <text x="820" y="260" fill="#FFFFFF">CARGO</text>
  </g>
</svg>