<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Guía de Importación · DTD Cargo</title>

<!--
  =========================================================================
  GUÍA INTERACTIVA DE IMPORTACIÓN POR ALIBABA — DTD CARGO (v2)
  Lead magnet gamificado y ADAPTATIVO por perfil. Lleva al cliente del miedo
  a tener su mercancía en el almacén DTD en China, paso a paso.

  NOVEDADES v2:
   - Selector de PERFIL al inicio: "Agente de compras" vs "Emprendedor".
     El contenido se adapta (capa profesional vs camino liviano).
   - Herramientas embebidas: Scorecard de proveedor, Calculadora de Landed
     Cost y Calculadora de volumen (CBM).
   - Captura PROGRESIVA de datos (perfil + nombre + WhatsApp) -> tuyos.

  >>> DATOS REALES: ya están cableados, no quedan marcadores que reemplazar.
      WHATSAPP  -> CRM DTD (CONTACT.ve.whatsappRaw de lib/design-tokens.ts)
      DIR_AUTOFILL -> bodega Yiwu (CONTACT.cn). La tarjeta copiar-por-campo de
                   direccionHTML() sigue el modelo MEDIDO en SDD-0264 contra
                   el formulario real de Alibaba: Ciudad = 金华市 (Jinhua),
                   Distrito = 义乌市 (Yiwu), destinatario = 林冠 + Shipping Mark.
                   Si cambia CONTACT.cn, se cambia también acá.
      Shipping Mark   -> del portal por ?mark= (y ?name=); sin param, el visitante
                   lo escribe y se comparte entre las tarjetas del Paso 1 y 7.

  >>> SERVICIOS: los bloques {tipo:"servicio"} salen del catálogo real
      (lib/shared/service-catalog.ts + lib/servicios-detalle.ts + lib/inspeccion.ts).
      NO inventar servicios ni precios acá. Los que están 'proximamente'
      (Transporte terrestre, Cursos de importación) no se anuncian.

  >>> INTEGRACIÓN DE DATOS (Supabase + Kommo) — PENDIENTE:
      Todo el lead vive en el objeto `lead`. Cada vez que cambia se llama
      a syncLead(evento). Busca "=== ENVIAR A SUPABASE/KOMMO ===" y cablea
      ahí tu endpoint. Hoy solo hace console.log: el lead NO se está guardando.
  =========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    /* Marca DTD (mirror del set PUBLICO: lib/design-tokens.ts / globals.css). Mantengo los NOMBRES
       de variable del v2 y solo cambio los VALORES a tokens DTD; asi el resto del CSS/JS no se toca. */
    --abismo:#0F1E3D;                        /* ink / navy */
    --marea:#7F0F1A;                         /* ACENTO = wine (antes teal) */
    --oro:#B8893A; --oro-suave:#F1E6CE;      /* dorado DTD + tint */
    --coral:#C2353F; --coral-suave:#F6E1E3;  /* danger publico + tint */
    --exito:#1F8A5B; --exito-suave:#DDEFE6;  /* success + tint */
    --espuma:#FBFAF7; --papel:#FFFFFF;       /* paper / white */
    --cream:#E8DCC8;                         /* cream (logo sobre navy) */
    --tinta:#1F1F1F; --bruma:#6B6B6B;        /* grey-900 texto / grey-500 suave */
    --linea:#C9C5BE; --radio:18px;           /* grey-300 bordes */
    --sombra:0 2px 4px rgba(15,30,61,.08), 0 12px 24px rgba(15,30,61,.10);
    --sombra-suave:0 1px 2px rgba(15,30,61,.05), 0 6px 16px rgba(15,30,61,.07);
    --f-ui:"Archivo","Noto Sans SC",system-ui,-apple-system,sans-serif;
    --f-display:"Archivo Black","Archivo",sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --f-cjk:"Noto Sans SC","Archivo",sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--f-ui);color:var(--tinta);
    background:var(--espuma);
    line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  h1,h2,.display{font-family:var(--f-display);font-weight:400;letter-spacing:-.015em}
  h3{font-family:var(--f-ui);font-weight:800;letter-spacing:-.005em}
  .wrap{max-width:880px;margin:0 auto;padding:18px 18px 64px}

  /* Marca */
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--abismo);color:#fff;
    border-radius:var(--radio);box-shadow:var(--sombra);position:relative;overflow:hidden}
  /* (sin gradiente decorativo de topbar — brand: cero gradientes) */
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:40px;height:auto;flex:none;display:block}
  .brand-txt{min-width:0}
  .brand-txt b{font-family:var(--f-ui);font-weight:700;font-size:16px;display:block;line-height:1.1}
  .brand-txt span{font-size:12.5px;color:var(--cream);letter-spacing:.02em}
  .topbar .spacer{flex:1}
  .modo{display:none;align-items:center;gap:8px}
  .modo .tag{background:rgba(184,137,58,.18);border:1px solid var(--oro);color:#fff;border-radius:999px;
    padding:5px 11px;font:700 12px var(--f-ui);white-space:nowrap}
  .modo .sw{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--cream);border-radius:8px;
    padding:5px 8px;font:600 11px var(--f-ui);cursor:pointer}
  .modo .sw:hover{background:rgba(255,255,255,.2)}

  .pasaporte{display:flex;align-items:center;gap:7px}
  .pasaporte .lbl{font-size:11px;color:var(--cream);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
  .insignia{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:rgba(232,220,200,.10);border:1px solid rgba(232,220,200,.22);filter:grayscale(1);opacity:.5;transition:.35s}
  .insignia.ganada{filter:none;opacity:1;background:rgba(184,137,58,.18);border-color:var(--oro);box-shadow:0 0 0 3px rgba(184,137,58,.14)}
  .insignia.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.3) rotate(-12deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1)}}

  /* Travesía */
  .voyage{margin-top:14px;background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);
    box-shadow:var(--sombra-suave);padding:16px 16px 12px}
  .voyage-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .puerto{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--abismo);white-space:nowrap}
  .puerto .sub{display:block;font-family:var(--f-ui);font-weight:600;font-size:11px;color:var(--bruma)}
  .puerto.dest{text-align:right}
  .contador{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--marea)}
  .rail-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 4px}
  .rail{position:relative;display:flex;align-items:flex-start;justify-content:space-between;min-width:560px;padding-top:4px}
  .rail .track{position:absolute;left:14px;right:14px;top:18px;height:3px;
    background:repeating-linear-gradient(90deg,var(--linea) 0 8px,transparent 8px 14px);border-radius:3px;z-index:0}
  .rail .track-fill{position:absolute;left:14px;top:18px;height:3px;background:var(--marea);border-radius:3px;z-index:1;transition:width .5s ease;width:0}
  .nodo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;background:none;border:none;cursor:pointer;font:inherit;padding:0}
  .nodo .punto{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--papel);
    border:2px solid var(--linea);color:var(--bruma);font-family:var(--f-ui);font-weight:700;font-size:12px;transition:.3s}
  .nodo .cap{font-size:10.5px;color:var(--bruma);max-width:78px;text-align:center;line-height:1.15;font-weight:600}
  .nodo[data-state="actual"] .punto{border-color:var(--oro);color:var(--abismo);box-shadow:0 0 0 4px rgba(184,137,58,.18);transform:scale(1.06)}
  .nodo[data-state="actual"] .cap{color:var(--abismo)}
  .nodo[data-state="hecho"] .punto{background:var(--exito);border-color:var(--exito);color:#fff}
  .nodo[data-state="bloqueado"]{cursor:not-allowed}
  .nodo[data-state="bloqueado"] .punto{opacity:.55}
  .nodo[data-state="bloqueado"] .cap{opacity:.5}

  /* Tarjeta */
  .card{margin-top:16px;background:var(--papel);border:1px solid var(--linea);border-radius:24px;
    box-shadow:var(--sombra);padding:26px 26px 24px;position:relative;overflow:hidden}
  .card.enter{animation:enter .45s ease both}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--marea);background:rgba(127,15,26,.08);padding:6px 11px;border-radius:999px}
  .titulo{font-size:clamp(22px,3.4vw,30px);font-weight:800;line-height:1.18;margin:14px 0 8px;color:var(--abismo)}
  .intro{font-size:16.5px;color:var(--tinta);margin:0 0 18px;max-width:62ch}

  .bloque{padding:16px 0;border-top:1px solid var(--linea)}
  .bloque:first-of-type{border-top:none;padding-top:4px}
  .bloque h3{font-size:16.5px;font-weight:700;margin:0 0 5px;color:var(--abismo);display:flex;gap:9px;align-items:flex-start}
  .bloque h3 .ic{flex:none;width:7px;height:7px;border-radius:2px;background:var(--marea);margin-top:7px}
  .bloque h3 .pro{font:700 10px var(--f-ui);letter-spacing:.06em;background:var(--abismo);color:#fff;border-radius:6px;padding:2px 7px;margin-left:4px;align-self:center}
  .bloque p{margin:0;color:var(--tinta);font-size:15.5px}
  .bloque p b{color:var(--abismo)}
  .bloque p a{color:var(--marea);font-weight:700;text-decoration:underline}
  .bloque p a:hover{color:var(--abismo)}

  .callout{border-radius:14px;padding:13px 15px;margin-top:4px;font-size:15px}
  .callout.tip{background:var(--oro-suave);border:1px solid #f3d489;color:#5e4708}
  .callout.tip b{color:#7a5c00}
  .callout.alerta{background:var(--coral-suave);border:1px solid #f0b8ad;color:#7a2517}
  .callout.alerta b{color:#9c2a18}
  .callout .k{display:block;font-family:var(--f-ui);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;opacity:.85}

  .plantilla{background:var(--abismo);border-radius:14px;padding:14px;margin-top:8px;color:color-mix(in srgb, var(--papel) 85%, var(--abismo));position:relative}
  .plantilla pre{margin:0;white-space:pre-wrap;font-family:var(--f-mono),"Noto Sans SC",monospace;font-size:13px;line-height:1.6}
  .plantilla .gloss{display:block;margin-top:8px;font-family:var(--f-ui);font-size:12.5px;color:#8fb0cc;font-style:italic}
  .btn-copy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);
    border-radius:9px;padding:5px 10px;font:600 12px var(--f-ui);cursor:pointer;transition:.2s}
  .btn-copy:hover{background:rgba(255,255,255,.2)}

  .quienes{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--espuma);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-top:4px}
  /* Marca de la casa. El isologo embebido es la variante REVERSE (pensada para fondo
     navy): sobre --espuma se perdería, por eso el recuadro va en --abismo. */
  .foto{width:84px;height:84px;border-radius:14px;flex:none;background:var(--abismo);border:1px solid var(--abismo);
    display:grid;place-items:center;padding:14px;color:var(--cream);font:700 12px var(--f-ui);text-align:center}
  .foto img{width:100%;height:100%;object-fit:contain;display:block}
  .quienes .qt{min-width:0;flex:1}
  .quienes .qt b{color:var(--abismo)}

  .greet{margin-top:10px;padding:10px 15px;border-radius:12px;background:color-mix(in srgb, var(--marea) 7%, var(--papel));border:1px solid color-mix(in srgb, var(--marea) 22%, var(--papel));font:600 13.5px var(--f-ui);color:var(--abismo)}
  .greet b{color:var(--marea)}
  /* Direccion Alibaba (copiar por campo) -- espejo del FAQ */
  .dir-card{border:1px solid var(--linea);border-radius:16px;overflow:hidden;background:var(--papel);margin-top:6px;box-shadow:var(--sombra-suave)}
  .dir-mark{padding:12px 16px;border-bottom:1px solid var(--linea);background:var(--espuma)}
  /* El código va AL LADO de su etiqueta, no debajo: es un dato corto y apilarlo
     costaba una línea entera. */
  .dir-mark .mk-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
  .dir-mark label{font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--bruma);margin:0}
  .dir-mark .row{display:block}
  .dir-mark input{height:32px;width:124px;padding:0 10px;border:1.5px solid var(--linea);border-radius:7px;background:var(--papel);font:700 13px var(--f-mono);letter-spacing:.04em;color:var(--abismo);outline:none}
  .dir-mark input:focus{border-color:var(--marea)}
  /* 60ch en vez de 42: la misma frase en menos renglones. */
  .dir-mark .h{margin-top:6px;font-size:12.5px;line-height:1.45;color:var(--bruma);max-width:60ch}
  .dir-mark .h a{color:var(--marea);font-weight:700;text-decoration:underline}
  /* Sin Shipping Mark no hay input que rellenar: hay un placeholder inerte y
     dos puertas. El código lo entrega el registro, no el visitante. */
  /* El borde va en --bruma (5.33:1 sobre papel), no en --linea (1.72:1): el
     placeholder parece un campo y es lo único que lo delimita. WCAG 1.4.11
     pide 3:1 para lo que identifica un componente. */
  .dir-mark .mk-vacio{display:inline-flex;align-items:center;height:32px;padding:0 10px;border:1.5px dashed var(--bruma);
    border-radius:7px;background:var(--papel);font:700 13px var(--f-mono);letter-spacing:.04em;color:var(--bruma)}
  .dir-mark .h .mk-puertas{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:8px}
  /* Especificidad a propósito: .dir-mark .h a (el enlace del hint) es 0-3-0 y
     le ganaba a una regla de dos clases, dejando el texto wine sobre un fondo
     wine — el botón se veía como un rectángulo vacío.
     40px de alto, como los demás clicables de la guía: el CTA al registro no
     puede ser el elemento más chico de la pantalla. */
  .dir-mark .h .mk-puertas a.mk-prim{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;
    font:700 12.5px var(--f-ui);text-decoration:none;border:1.5px solid var(--marea);
    background:var(--marea);color:var(--papel);transition:background .15s,color .15s}
  .dir-mark .h .mk-puertas a.mk-prim:hover{background:var(--abismo);border-color:var(--abismo);color:var(--papel)}
  /* El secundario es la salida, no la acción: enlace, no botón. Dos botones
     iguales al lado no dicen cuál es el camino. */
  .dir-mark .h .mk-puertas a.mk-sec{font:700 12.5px var(--f-ui);color:var(--marea);text-decoration:underline;
    text-underline-offset:3px;padding:4px 0}
  .dir-mark .h .mk-puertas a.mk-sec:hover{color:var(--abismo)}
  /* El foco, declarado: sobre wine el outline por defecto del navegador no
     tiene contraste garantizado. Mismo patrón que .svc>summary.
     El offset de 4px es parte del contraste, no decoración: separa el anillo
     del relleno wine y lo apoya en --espuma (navy/espuma 15.8:1 · wine/espuma
     10.1:1). Pegado al botón, navy sobre wine sería 1.56:1. */
  .dir-mark .h .mk-puertas a.mk-prim:focus-visible{outline:2px solid var(--abismo);outline-offset:4px}
  .dir-mark .h .mk-puertas a.mk-sec:focus-visible{outline:2px solid var(--marea);outline-offset:4px}
  @media (max-width:520px){
    .dir-mark .h .mk-puertas{flex-direction:column;align-items:stretch;gap:10px}
    .dir-mark .h .mk-puertas a.mk-prim{width:100%;justify-content:center;height:44px}
    .dir-mark .h .mk-puertas a.mk-sec{text-align:center}
  }
  .dir-mark input[readonly]{background:var(--espuma);cursor:default}
  /* Paso 7: la dirección de una pieza, para pegársela al proveedor en el chat. */
  .dir-full-body{padding:16px;display:flex;flex-direction:column;gap:12px}
  .dir-full-body .dff .k{font:700 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--bruma)}
  .dir-full-body .dff .v{margin-top:4px;font:700 15px var(--f-mono);color:var(--abismo);line-height:1.5;word-break:break-word}
  .dir-full-body .dff .v.cjk{font-family:var(--f-cjk)}
  .dir-copy-all{align-self:flex-start;margin-top:4px;height:40px;padding:0 20px;font-size:13.5px}
  .dir-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--linea)}
  .dir-row:last-of-type{border-bottom:none}
  .dir-row .k{font:700 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--bruma)}
  .dir-row .k .cjk{font-family:var(--f-cjk)}
  .dir-row .v{margin-top:2px;font:700 15px var(--f-mono);color:var(--abismo);word-break:break-word}
  .dir-row .v.cjk{font-family:var(--f-cjk);font-weight:500}
  .dir-row .hint{margin-top:3px;font-size:12px;line-height:1.42;color:var(--bruma)}
  .dir-copy{flex:none;height:38px;min-width:92px;padding:0 14px;border:1px solid var(--linea);border-radius:8px;background:var(--papel);font:700 12.5px var(--f-ui);color:var(--abismo);cursor:pointer;transition:.15s}
  .dir-copy:hover{border-color:var(--marea);color:var(--marea)}
  .dir-nota{padding:13px 16px;background:var(--espuma);border-top:3px solid var(--marea);font-size:13px;line-height:1.55;color:var(--bruma)}
  .dir-nota b{color:var(--abismo)}

  /* Servicio DTD — la carta que dice "esto no lo tienes que hacer tú" */
  .svc{border:1px solid var(--linea);border-left:4px solid var(--marea);border-radius:14px;background:var(--papel);
    padding:15px 16px;margin-top:12px;box-shadow:var(--sombra-suave)}
  .svc .eyebrow-svc{display:block;font:800 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--marea);margin-bottom:5px}
  .svc h4{margin:0 0 6px;font:700 16.5px var(--f-ui);color:var(--abismo)}
  /* Plegado: el servicio se ve, pero no se echa encima de quien está aprendiendo. */
  .svc>summary{list-style:none;cursor:pointer;padding:4px 24px 4px 0;position:relative;border-radius:8px}
  .svc>summary::-webkit-details-marker{display:none}
  .svc>summary::marker{content:""}
  .svc>summary .svc-t{display:block;font:700 16.5px var(--f-ui);color:var(--abismo);line-height:1.3}
  .svc>summary:hover .svc-t{color:var(--marea)}
  .svc>summary:focus-visible{outline:2px solid var(--marea);outline-offset:4px}
  .svc .svc-chev{position:absolute;right:2px;top:50%;width:9px;height:9px;margin-top:-6px;
    border-right:2.2px solid var(--marea);border-bottom:2.2px solid var(--marea);
    transform:rotate(45deg);transition:transform .18s ease}
  .svc[open] .svc-chev{transform:rotate(-135deg);margin-top:-3px}
  .svc .svc-body{margin-top:12px}
  @media (prefers-reduced-motion:reduce){ .svc .svc-chev{transition:none} }
  .svc p{margin:0;font-size:15px;color:var(--tinta)}
  .svc p b{color:var(--abismo)}
  .svc .svc-items{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .svc .svc-items li{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--tinta);line-height:1.45}
  .svc .svc-items .code{flex:none;min-width:52px;text-align:center;padding:2px 6px;border-radius:6px;
    background:var(--abismo);color:var(--cream);font:700 11px var(--f-mono);letter-spacing:.03em}
  .svc .svc-items b{color:var(--abismo)}
  .svc-tabla{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  .svc-tabla th{text-align:left;padding:6px 8px;background:var(--espuma);color:var(--abismo);font:700 12px var(--f-ui);
    letter-spacing:.02em;border-bottom:1px solid var(--linea)}
  .svc-tabla td{padding:6px 8px;border-bottom:1px solid var(--linea);color:var(--tinta)}
  .svc-tabla td:first-child{font-family:var(--f-mono);font-size:12.5px}
  .svc-tabla tr:last-child td{border-bottom:none}
  .svc-nota{margin-top:9px;font-size:12.5px;line-height:1.5;color:var(--bruma)}
  .svc-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
  .svc-cta a{display:inline-flex;align-items:center;height:38px;padding:0 15px;border-radius:9px;
    font:700 13px var(--f-ui);text-decoration:none;transition:.15s;border:1px solid var(--marea)}
  .svc-cta .a-prim{background:var(--marea);color:var(--papel)}
  .svc-cta .a-prim:hover{background:var(--abismo);border-color:var(--abismo)}
  .svc-cta .a-sec{background:var(--papel);color:var(--marea)}
  .svc-cta .a-sec:hover{background:var(--espuma)}

  /* Selector de perfil */
  .perfil-wrap{margin:6px 0 2px}
  .perfil-q{font-family:var(--f-ui);font-weight:700;font-size:15px;color:var(--abismo);margin-bottom:10px}
  .perfil-cards{display:flex;gap:12px;flex-wrap:wrap}
  .perfil-card{flex:1;min-width:200px;border:2px solid var(--linea);border-radius:16px;padding:16px;cursor:pointer;transition:.2s;background:#fff}
  .perfil-card:hover{border-color:var(--marea)}
  .perfil-card.sel{border-color:var(--oro);background:var(--oro-suave);box-shadow:0 0 0 3px rgba(184,137,58,.15)}
  .perfil-card .pe{font-size:26px}
  .perfil-card b{display:block;font-family:var(--f-ui);font-size:15px;color:var(--abismo);margin:6px 0 3px}
  .perfil-card span{font-size:13px;color:var(--bruma)}

  /* Captura */

  /* Herramientas */
  .tool{border:1.5px solid var(--marea);border-radius:16px;padding:16px;margin-top:6px;background:#fbfeff}
  .tool-h{font-family:var(--f-ui);font-weight:700;font-size:15px;color:var(--abismo);display:flex;align-items:center;gap:8px}
  .tool-d{font-size:13.5px;color:var(--bruma);margin:4px 0 12px}
  .tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .tool-grid label{font-size:12px;font-weight:700;color:var(--abismo);display:block;margin-bottom:4px}
  .tool-grid input{width:100%;border:1.5px solid var(--linea);border-radius:10px;padding:10px;font:inherit;font-size:14px;background:#fff}
  .tool-grid input:focus{outline:none;border-color:var(--marea)}
  .tool .tool-tarifa{margin:12px 0 0;font-size:12.5px;line-height:1.5;color:var(--bruma)}
  .tool .tool-tarifa b{color:var(--abismo)}
  .tool .brk small{font-weight:400;color:var(--bruma)}
  .tool .calc{margin-top:12px;background:var(--abismo);color:#fff;border:none;border-radius:11px;padding:11px 18px;font:700 14px var(--f-ui);cursor:pointer}
  .tool .calc:hover{filter:brightness(1.15)}
  .tool-out{margin-top:12px;display:none}
  .tool-out.show{display:block;animation:enter .35s ease both}
  .brk{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--linea);font-size:14px;color:var(--tinta)}
  .brk b{color:var(--abismo)}
  .big-res{margin-top:10px;background:var(--exito-suave);border:1px solid #b6e0cc;border-radius:12px;padding:13px;text-align:center}
  .big-res .n{font-family:var(--f-ui);font-weight:800;font-size:26px;color:#0f5a3c}
  .big-res .l{font-size:12.5px;color:#0f5a3c;text-transform:uppercase;letter-spacing:.06em}
  .disc{font-size:11.5px;color:var(--bruma);margin-top:8px;font-style:italic}
  .disc a{color:var(--marea);font-weight:700;font-style:normal;text-decoration:underline}
  .disc a:hover{color:var(--abismo)}

  /* Scorecard */
  .sc-crit{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--linea);border-radius:11px;margin-bottom:8px;cursor:pointer;user-select:none;transition:.15s}
  .sc-crit:hover{border-color:var(--marea)}
  .sc-crit .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--linea);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .sc-crit.on{border-color:var(--exito);background:var(--exito-suave)}
  .sc-crit.on .b{background:var(--exito);border-color:var(--exito)}
  .sc-crit .t{font-size:14px;color:var(--tinta)}
  .sc-meter{margin-top:6px;text-align:center;border-radius:12px;padding:13px}
  .sc-meter .n{font-family:var(--f-ui);font-weight:800;font-size:24px}
  .sc-meter .v{font-weight:700;font-size:14px}

  /* Tabla Incoterms */
  .mini-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
  .mini-table th,.mini-table td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--linea)}
  .mini-table th{background:var(--espuma);font-family:var(--f-ui);font-size:12px;color:var(--abismo);text-transform:uppercase;letter-spacing:.04em}
  .mini-table td b{color:var(--abismo)}

  /* Checklist */
  .checklist{margin-top:18px;border-top:1px dashed var(--linea);padding-top:16px}
  .checklist .ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .checklist .ch-head .t{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bruma)}
  .checklist .ch-head .cnt{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--marea)}
  .check{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--linea);border-radius:13px;margin-bottom:9px;cursor:pointer;transition:.18s;background:var(--papel);user-select:none}
  .check:hover{border-color:var(--marea);background:#fbfdfe}
  .check .box{width:23px;height:23px;border-radius:7px;border:2px solid var(--linea);flex:none;display:grid;place-items:center;transition:.2s;color:#fff;font-size:14px;font-weight:800}
  .check .lbl{font-size:15px;color:var(--tinta);padding-top:1px}
  .check.on{border-color:var(--exito);background:var(--exito-suave)}
  .check.on .box{background:var(--exito);border-color:var(--exito)}
  .check.on .lbl{color:color-mix(in srgb, var(--exito) 78%, black)}

  .nav{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
  .btn{font-family:var(--f-ui);font-weight:700;border-radius:13px;padding:13px 20px;font-size:15px;cursor:pointer;border:2px solid transparent;transition:.2s;display:inline-flex;align-items:center;gap:9px}
  .btn:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
  .btn-prim{background:var(--abismo);color:#fff}
  .btn-prim:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .btn-prim:disabled{background:#aab9c7;cursor:not-allowed;transform:none}
  .btn-ghost{background:#fff;color:var(--abismo);border-color:var(--linea)}
  .btn-ghost:hover{border-color:var(--abismo)}
  .btn-oro{background:var(--marea);color:#fff}
  .btn-oro:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .nav .hint{font-size:13.5px;color:var(--bruma);font-weight:600}
  .nav .spacer{flex:1}

  .sello{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-16deg) scale(.4);
    border:4px solid var(--marea);color:var(--marea);font-family:var(--f-display);font-weight:400;font-size:32px;letter-spacing:.06em;
    padding:8px 22px;border-radius:12px;opacity:0;pointer-events:none;z-index:30;text-transform:uppercase;background:rgba(255,255,255,.5)}
  .sello.go{animation:sello 1.15s ease forwards}
  @keyframes sello{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(1.7)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(.95)}26%{transform:translate(-50%,-50%) rotate(-16deg) scale(1.02)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--abismo);color:#fff;
    padding:13px 18px;border-radius:14px;box-shadow:var(--sombra);display:flex;align-items:center;gap:11px;z-index:50;font-weight:700;max-width:92vw}
  .toast.show{transform:translateX(-50%) translateY(0);transition:transform .4s cubic-bezier(.2,1.2,.3,1)}
  .toast .em{font-size:22px}
  .toast small{display:block;font-weight:600;color:var(--cream);font-size:12.5px}

  .trofeo{text-align:center;padding:6px 0 2px}
  .resumen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .chip{background:var(--exito-suave);color:#0f5a3c;border:1px solid #b6e0cc;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .form{margin-top:10px;background:var(--espuma);border:1px solid var(--linea);border-radius:18px;padding:18px}
  .form label{display:block;font-weight:700;font-size:14px;color:var(--abismo);margin:12px 0 6px}
  .form input,.form textarea{width:100%;border:1.5px solid var(--linea);border-radius:11px;padding:12px 13px;font:inherit;font-size:15px;background:#fff;color:var(--tinta)}
  .form input:focus,.form textarea:focus{outline:none;border-color:var(--marea);box-shadow:0 0 0 3px rgba(127,15,26,.12)}
  .form .row{display:flex;gap:12px;flex-wrap:wrap}
  .form .row>div{flex:1;min-width:160px}
  .form .priv{font-size:12.5px;color:var(--bruma);margin-top:10px}
  .gracias{display:none;text-align:center;padding:8px 0}
  .gracias.show{display:block;animation:enter .4s ease both}

  .pie{margin-top:22px;text-align:center;font-size:12.5px;color:var(--bruma)}
  .pie a{color:var(--marea);text-decoration:none;font-weight:700}
  .confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:45;border-radius:2px;pointer-events:none}

  @media (max-width:640px){
    .wrap{padding:12px 12px 56px}
    .card{padding:20px 18px;border-radius:20px}
    .pasaporte .lbl{display:none}
    .pasaporte .insignia{width:26px;height:26px;font-size:13px}
    .topbar{padding:12px 14px;flex-wrap:wrap}
    .titulo{font-size:23px}
    .voyage-head .puerto .sub{display:none}
    .nav .btn{flex:1;justify-content:center}
    .nav .spacer{display:none}
    .modo .tag{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ actual:estado.actual, completadas:[...estado.completadas], checks:Object.fromEntries(Object.entries(estado.checks).map(([k,v])=>[k,[...v]])), lead })); }catch(e){} }
function restore(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return; const d=JSON.parse(raw); if(typeof d.actual==="number") estado.actual=d.actual; if(Array.isArray(d.completadas)) estado.completadas=new Set(d.completadas); if(d.checks) for(const k in d.checks) estado.checks[k]=new Set(d.checks[k]); if(d.lead) Object.assign(lead,d.lead); }catch(e){} }

function servicioHTML(b){
  let items = "";
  if (b.items && b.items.length) {
    items = '<ul class="svc-items">';
    b.items.forEach(function(it){
      items += '<li><span class="code">'+it.code+'</span><span><b>'+it.t+'</b> — '+it.d+'</span></li>';
    });
    items += '</ul>';
  }

  let tabla = "";
  if (b.tabla) {
    tabla = '<table class="svc-tabla"><tr>';
    b.tabla.columnas.forEach(function(c){ tabla += '<th>'+c+'</th>'; });
    tabla += '</tr>';
    b.tabla.filas.forEach(function(f){
      tabla += '<tr>';
      f.forEach(function(c){ tabla += '<td>'+c+'</td>'; });
      tabla += '</tr>';
    });
    tabla += '</table>';
  }

  const nota = b.nota ? '<div class="svc-nota">'+b.nota+'</div>' : "";
  const ver  = b.ver ? '<a class="a-prim" href="https://dtdcargo.com'+b.ver+'" target="_blank" rel="noopener">'+(b.verLabel||"Ver el detalle")+' →</a>' : "";

  // <details> nativo: cerrado por defecto, cero JS, accesible de fábrica. El
  // título propio va en el resumen para que se sepa de qué es sin abrirlo.
  return '<details class="svc">'+
    '<summary><span class="eyebrow-svc">Servicio DTD</span><span class="svc-t">'+b.h+'</span><span class="svc-chev" aria-hidden="true"></span></summary>'+
    '<div class="svc-body">'+
      '<p>'+b.p+'</p>'+
      items + tabla + nota +
      (ver ? '<div class="svc-cta">'+ver+'</div>' : '')+
    '</div></details>';
}

/* ---------- Wiring de elementos interactivos ---------- */
function wire(){
  const i=estado.actual;
  stageEl.querySelectorAll(".check").forEach(ch=> ch.addEventListener("click",()=>toggleCheck(parseInt(ch.dataset.idx))));
  stageEl.querySelectorAll(".btn-copy").forEach(btn=> btn.addEventListener("click",()=>{
    navigator.clipboard.writeText(decodeURIComponent(btn.dataset.copy)).then(()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1500);}); }));
  stageEl.querySelectorAll(".perfil-card").forEach(c=> c.addEventListener("click",()=>elegirPerfil(c.dataset.perfil)));
  if($("#btnPrev")) $("#btnPrev").addEventListener("click",()=>irA(i-1));
  if($("#btnNext")) $("#btnNext").addEventListener("click",completarEtapa);
  // herramientas
  stageEl.querySelectorAll("[data-calc]").forEach(b=> b.addEventListener("click",()=>calcTool(b.dataset.calc)));
  // direccion: Shipping Mark en vivo + copiar por campo (espejo del FAQ)
  const dirM = stageEl.querySelector("#dirMark");
  if(dirM){ dirM.addEventListener("input", ()=>{
    const m=(dirM.value||"").trim().toUpperCase();
    const d=stageEl.querySelector("#dirDest"); if(d) d.textContent="林冠 "+(m||"DTD-XXXX");
    // se guarda para que la tarjeta del Paso 7 arranque con el mismo mark del Paso 1
    if(!HAS_MARK){ lead.markbox=m; persist(); }
    // refresca en vivo los textos que llevan {MARK} en esta misma etapa (checklist incluido)
    const et=ETAPAS[estado.actual];
    stageEl.querySelectorAll(".check .lbl").forEach((el,idx)=>{
      if(et.checklist && et.checklist[idx]) el.innerHTML=conMark(et.checklist[idx]);
    });
  }); }
  stageEl.querySelectorAll(".dir-copy").forEach(btn=> btn.addEventListener("click",()=>{
    let val=btn.dataset.val;
    if(btn.dataset.field==="destinatario"){
      const i=stageEl.querySelector("#dirMark"); const m=(((i&&i.value)||markActual())).trim().toUpperCase();
      if(!m){
        const p=stageEl.querySelector(".mk-prim"); if(p) p.focus();
        const o=btn.textContent; btn.textContent="Regístrate primero ↑"; setTimeout(()=>btn.textContent=o,2200); return;
      }
      // Dos botones distintos: el del Paso 1 copia SÓLO el campo «Nombre y
      // apellido» del formulario de Alibaba; el del Paso 7 copia las tres
      // líneas que se le pasan al proveedor. Reconstruir "林冠 "+mark para
      // los dos dejaba al Paso 7 sin dirección ni teléfono.
      val = btn.classList.contains("dir-copy-all")
        ? val.split("DTD-XXXX").join(m)
        : "林冠 "+m;
    }
    navigator.clipboard.writeText(val).then(()=>{ const o=btn.textContent; btn.textContent="✓ Copiado"; setTimeout(()=>btn.textContent=o,1600); }).catch(()=>{});
  }));
  stageEl.querySelectorAll(".sc-crit").forEach(c=> c.addEventListener("click",()=>{ c.classList.toggle("on"); c.querySelector(".b").textContent=c.classList.contains("on")?"✓":""; scoreUpdate(); }));
  actualizarBotonNext();
}

function elegirPerfil(p){ lead.perfil=p; syncLead("perfil"); renderModo(); renderEtapa(); }


/* ---------- Herramientas: cálculo ---------- */
function calcTool(t){
  if(t==="cbm"){
    const L=+$("#cbmL").value||0,W=+$("#cbmW").value||0,H=+$("#cbmH").value||0,Q=+$("#cbmQ").value||0;
    const cajaM3=(L*W*H)/1e6, total=cajaM3*Q;
    lead.cbm={L,W,H,Q,total:+total.toFixed(3)}; syncLead("cbm");
    $("#cbmOut").innerHTML='<div class="brk"><span>CBM por caja</span><b>'+cajaM3.toFixed(4)+' m³</b></div>'+
      '<div class="big-res"><div class="n">'+total.toFixed(3)+' m³</div><div class="l">Volumen total a enviar</div></div>'+
      '<p class="disc">Con este CBM te cotizamos el flete de carga suelta (LCL). Escríbenos y lo afinamos.</p>';
    $("#cbmOut").classList.add("show");
  }
  if(t==="landed"){
    const P=+$("#lcP").value||0, Q=+$("#lcQ").value||0, C=+($("#lcCbm")||{}).value||0;
    // Con tarifa del ERP el flete sale del CBM; sin ella, del campo manual.
    let F, fuente;
    if(TARIFA){
      const bruto=C*TARIFA.per_cbm;
      F=(TARIFA.min_charge && bruto<TARIFA.min_charge) ? TARIFA.min_charge : bruto;
      fuente=C ? (fmt3(C)+' m³ × $'+fmt(TARIFA.per_cbm)+'/m³') : 'falta tu CBM';
    } else {
      F=+(($("#lcF")||{}).value)||0; fuente='el que pusiste';
    }
    const merc=P*Q, total=merc+F, unit=Q?total/Q:0;
    lead.landed={P,Q,cbm:C,F:+F.toFixed(2),total:+total.toFixed(2),unit:+unit.toFixed(2),
      tarifa:TARIFA?TARIFA.per_cbm:null}; syncLead("landed");
    $("#lcOut").innerHTML='<div class="brk"><span>Mercancía (FOB × cantidad)</span><b>$'+fmt(merc)+'</b></div>'+
      '<div class="brk"><span>Flete puerta a puerta <small>('+fuente+')</small></span><b>$'+fmt(F)+'</b></div>'+
      '<div class="brk"><span><b>Total puesto en Venezuela</b></span><b>$'+fmt(total)+'</b></div>'+
      '<div class="big-res"><div class="n">$'+fmt(unit)+'</div><div class="l">Costo real por unidad, puesta en Venezuela</div></div>'+
      '<p class="disc"><b>Es un aproximado, y estas tres cosas lo mueven:</b> el <b>peso</b> (cada m³ incluye hasta 1.000 kg; por encima de eso hay recargo por kilo), el <b>embalaje</b> (si necesita madera o paleta) y las <b>baterías</b>, que encarecen el flete. Cajas de tamaños distintos también cambian el CBM real al consolidar. Acá va el <b>flete base por volumen</b>, sin esos recargos ni la entrega dentro de Venezuela: es para que sepas si el negocio da <i>antes</i> de pedir la cotización. El cálculo completo está en <a href="https://dtdcargo.com/tarifas" target="_blank" rel="noopener">nuestra calculadora de tarifas</a>, y el número en firme te lo cierra un asesor.</p>';
    $("#lcOut").classList.add("show");
  }
}
function scoreUpdate(){
  const ons=stageEl.querySelectorAll(".sc-crit.on").length, tot=stageEl.querySelectorAll(".sc-crit").length;
  const m=$("#scMeter"); if(!m) return; m.style.display="block";
  let col,txt,bg;
  if(ons>=6){col="#0f5a3c";bg="var(--exito-suave)";txt="Proveedor sólido";}
  else if(ons>=4){col="#7a5c00";bg="var(--oro-suave)";txt="Con cautela — pide más pruebas";}
  else {col="#9c2a18";bg="var(--coral-suave)";txt="Riesgoso — mejor descártalo";}
  m.style.background=bg; m.style.color=col;
  m.innerHTML='<div class="n">'+ons+'/'+tot+'</div><div class="v">'+txt+'</div>';
  lead.scorecard={score:ons,total:tot}; syncLead("scorecard");
}

/* ---------- Checklist + navegación ---------- */
function actualizarBotonNext(){
  const i=estado.actual, et=ETAPAS[i]; if(et.final) return;
  const btn=$("#btnNext"), hint=$("#navHint"); if(!btn) return;
  if(estado.completadas.has(i)){ btn.disabled=false; if(hint) hint.textContent=""; return; }
  const perfilFalta = (i===0 && !lead.perfil);
  const faltan=et.checklist.length-estado.checks[i].size;
  btn.disabled = faltan>0 || perfilFalta;
  if(hint) hint.textContent = perfilFalta ? "Elige tu perfil arriba" : (faltan>0?"Marca todo para avanzar":"");
}
function toggleCheck(idx){
  const i=estado.actual; if(estado.completadas.has(i)) return;
  if(estado.checks[i].has(idx)) estado.checks[i].delete(idx); else estado.checks[i].add(idx);
  const el=stageEl.querySelector('.check[data-idx="'+idx+'"]'), on=estado.checks[i].has(idx);
  el.classList.toggle("on",on); el.querySelector(".box").textContent=on?"✓":"";
  $("#chCnt").textContent=estado.checks[i].size+" de "+ETAPAS[i].checklist.length; persist();
  actualizarBotonNext();
}
function completarEtapa(){
  const i=estado.actual, et=ETAPAS[i], ya=estado.completadas.has(i);
  estado.completadas.add(i); lead.etapaMax=Math.max(lead.etapaMax,i+1);
  if(!ya){ syncLead("etapa_completada_"+(i+1)); sello(); insigniaPop(i); confeti(); toast(et.insignia.e,"Insignia desbloqueada",et.insignia.n); }
  renderRail(); renderPasaporte();
  setTimeout(()=>{ if(i<ETAPAS.length-1) irA(i+1); else renderRail(); }, ya?0:650);
}
function irA(i){ if(i<0||i>=ETAPAS.length||estadoNodo(i)==="bloqueado") return;
  estado.actual=i; persist(); renderRail(); renderPasaporte(); renderEtapa();
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); }

/* ---------- Efectos ---------- */
function sello(){ const s=$("#sello"); if(!s||reduce) return; s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); }
function insigniaPop(i){ const ins=$("#pasaporte").querySelectorAll(".insignia")[i]; if(ins&&!reduce){ins.classList.add("pop");setTimeout(()=>ins.classList.remove("pop"),600);} }
function toast(em,t,sub){ $("#toastEm").textContent=em; $("#toastTxt").innerHTML=t+"<small>"+sub+"</small>"; const el=$("#toast"); el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2600); }
function confeti(){ if(reduce) return; const cols=["#B8893A","#7F0F1A","#1F8A5B","#C2353F","#0F1E3D"];
  for(let n=0;n<34;n++){ const c=document.createElement("div"); c.className="confetti"; c.style.left=(Math.random()*100)+"vw"; c.style.background=cols[n%cols.length]; c.style.transform="rotate("+(Math.random()*360)+"deg)";
    const dur=1.6+Math.random()*1.4, x=(Math.random()*120-60);
    c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+x+"px,105vh) rotate(720deg)",opacity:.9}],{duration:dur*1000,easing:"cubic-bezier(.2,.6,.4,1)"});
    document.body.appendChild(c); setTimeout(()=>c.remove(),dur*1000); } }

/* ---------- Final ---------- */
function renderFinal(){
  const r=$("#resumen"); ETAPAS.forEach(et=>{ const ch=document.createElement("span"); ch.className="chip"; ch.textContent=et.insignia.n; r.appendChild(ch); });
  $("#btnCotizar").addEventListener("click",enviarLead);
}
function enviarLead(){
  const nombre=($("#fNombre").value||"").trim(), wa=($("#fWa").value||"").trim(), prod=($("#fProd").value||"").trim(), nota=($("#fNota").value||"").trim();
  if(!nombre||!prod){ alert("Pon al menos tu nombre y el producto que quieres importar."); return; }
  lead.nombre=nombre; lead.whatsapp=wa; lead.producto=prod; lead.nota=nota; lead.contactDone=true;
  syncLead("lead_final");
  // persist() ya corrió dentro de syncLead: el registro lee estos datos del
  // localStorage (mismo origen), así que la URL va limpia — sin nombre ni
  // teléfono, que no tienen por qué quedar en logs ni en el historial.
  const link=REG_HREF;
  $("#waLink").href=link; $("#formWrap").style.display="none"; $("#gracias").classList.add("show"); confeti();
  try{ window.open(link,"_blank","noopener"); }catch(e){}
}

/* ---------- WhatsApp pie ---------- */
(function(){ const num=(WHATSAPP&&WHATSAPP.indexOf("{{")<0)?WHATSAPP:""; $("#waPie").href="https://wa.me/"+num+"?text="+encodeURIComponent("Hola DTD Cargo, tengo una duda con la guía de Alibaba."); })();

/* ---------- Arranque ---------- */
$("#modoSw").addEventListener("click",()=> irA(0)); // "cambiar" -> vuelve al selector de perfil
if(HAS_MARK){ const g=$("#greet"); if(g){ g.hidden=false; g.innerHTML=(URL_NAME?"Hola <b>"+esc(URL_NAME)+"</b> · ":"")+"tu Shipping Mark es <b>"+MARK+"</b> — va en la dirección que cargas en el Paso 1, para que tu caja llegue identificada."; } }
restore(); renderRail(); renderPasaporte(); renderModo(); renderEtapa();

/* ---------- Tarifa vigente (SDD-0474) ----------
   Se pide después del primer render para no retrasar la pintura. Si responde
   con la herramienta ya en pantalla, se repinta solo esa línea. */
fetch("/api/public/cbm-rate", {headers:{Accept:"application/json"}})
  .then(r=> r.ok ? r.json() : null)
  .then(d=>{
    if(!d || typeof d.per_cbm !== "number" || !(d.per_cbm>0)) return;
    TARIFA = {per_cbm:d.per_cbm, min_charge:(typeof d.min_charge==="number"?d.min_charge:null)};
    const n=$("#lcTarifa");
    if(n){ n.innerHTML=tarifaNotaHTML(); }
    // El campo de flete manual sobra si la tarifa llegó: se vuelve a pintar
    // la herramienta completa, pero sólo si está visible y sin resultado aún.
    const out=$("#lcOut");
    if($("#lcF") && out && !out.classList.contains("show")) renderEtapa();
  })
  .catch(()=>{});
</script>
