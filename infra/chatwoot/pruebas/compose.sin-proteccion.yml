# CONTROL de la prueba de /register (SDD-0584). Nunca en el VPS.
#
# Tapa el inicializador de protección con un archivo vacío: el mismo stack, sin la
# protección. prueba-register.sh tiene que VER llegar el /register del número protegido
# al servidor falso con este overlay; si no lo ve, la sonda no sabe detectar la llamada
# y su «cero» con la protección no vale nada.

services:
  prepare:
    volumes:
      - ./pruebas/vacio.rb:/app/config/initializers/zz_dtd_proteccion_register.rb:ro
  rails:
    volumes:
      - ./pruebas/vacio.rb:/app/config/initializers/zz_dtd_proteccion_register.rb:ro
  sidekiq:
    volumes:
      - ./pruebas/vacio.rb:/app/config/initializers/zz_dtd_proteccion_register.rb:ro
